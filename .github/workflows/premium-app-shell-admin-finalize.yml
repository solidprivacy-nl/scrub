name: Premium app shell admin finalize

on:
  push:
    branches:
      - wp/premium-app-shell-implementation
    paths:
      - .github/workflows/premium-app-shell-admin-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp/premium-app-shell-implementation
          fetch-depth: 0
      - name: Prepend closeout records and self-clean
        run: |
          for spec in \
            "admin/premium_app_shell_workpackages_prefix.md:WORKPACKAGES.md" \
            "admin/premium_app_shell_changelog_prefix.md:CHANGELOG.md" \
            "admin/premium_app_shell_release_prefix.md:RELEASE_NOTES.md"
          do
            prefix="${spec%%:*}"
            target="${spec##*:}"
            cat "$prefix" "$target" > "$target.new"
            mv "$target.new" "$target"
          done
          rm -f \
            admin/premium_app_shell_workpackages_prefix.md \
            admin/premium_app_shell_changelog_prefix.md \
            admin/premium_app_shell_release_prefix.md \
            .github/workflows/premium-app-shell-admin-finalize.yml
      - name: Commit final administration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(ui): finalize Premium App Shell workpackage"
          git push origin HEAD:wp/premium-app-shell-implementation
