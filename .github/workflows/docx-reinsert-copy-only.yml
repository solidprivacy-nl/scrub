name: DOCX reinsert copy only

on:
  push:
    branches:
      - main
    paths:
      - operator_triggers/docx_reinsert_copy_only.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrub-mvp-document-hygiene-fidelity-hardening
          fetch-depth: 0
      - run: python scripts/patch_docx_reinsert_capability_copy_only.py
      - name: Commit
        run: |
          git config user.name 'solidprivacy-workpackage-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add reinsert_mode_ui.py
          git commit -m 'Align DOCX reinsert capability copy'
          git push origin HEAD:scrub-mvp-document-hygiene-fidelity-hardening
