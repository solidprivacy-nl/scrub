name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize validation evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'scrub-processed-text-selection-table-integration'
        run: |
          git checkout -B scrub-processed-text-selection-table-integration origin/scrub-processed-text-selection-table-integration
          python ops/finalize_processed_text_selection_validation_evidence.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/tests.yml
          rm ops/finalize_processed_text_selection_validation_evidence.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record processed-text selection validation evidence"
          git push origin HEAD:scrub-processed-text-selection-table-integration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf

      - name: Run regression tests
        run: |
          python -m pytest -q tests
