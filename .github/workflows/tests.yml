name: Tests

on:
  push:
    branches:
      - main
      - scrub-care-profile-long-form-hf-verify
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify exact Hugging Face runtime files
        if: github.ref == 'refs/heads/scrub-care-profile-long-form-hf-verify'
        run: python ops/verify_long_form_care_hf_sync.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf

      - name: Run regression tests
        run: |
          python -m pytest -q tests
