name: Tests

on:
  push:
    branches:
      - main
      - scrub-processed-text-selection-masking-plan
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply processed-text selection masking plan
        if: github.ref == 'refs/heads/scrub-processed-text-selection-masking-plan'
        run: |
          python ops/apply_processed_text_selection_masking_plan.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/tests.yml
          rm ops/apply_processed_text_selection_masking_plan.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate processed-text selection masking plan"
          git push origin HEAD:scrub-processed-text-selection-masking-plan

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf

      - name: Run regression tests
        run: |
          python -m pytest -q tests
