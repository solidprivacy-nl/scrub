name: Tests

on:
  push:
    branches:
      - main
      - scrub-processed-text-selection-masking-contract
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply processed-text selection masking contract governance
        if: github.ref == 'refs/heads/scrub-processed-text-selection-masking-contract' || github.head_ref == 'scrub-processed-text-selection-masking-contract'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ops/apply_processed_text_selection_masking_contract.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '    "SCRUB-WP_PROCESSED_TEXT_SELECTION_MASKING_CONTRACT",\n    f\'\'\'## {TIMESTAMP} — SCRUB-WP_PROCESSED_TEXT_SELECTION_MASKING_CONTRACT':
                  '    "## 2026-08-04 00:09 Europe/Amsterdam — SCRUB-WP_PROCESSED_TEXT_SELECTION_MASKING_CONTRACT",\n    f\'\'\'## {TIMESTAMP} — SCRUB-WP_PROCESSED_TEXT_SELECTION_MASKING_CONTRACT',
              '    "D040 — Use a two-stage server-authoritative protocol for direct masking from processed text",\n    \'\'\'## 2026-08-04 — D040 — Use a two-stage server-authoritative protocol for direct masking from processed text':
                  '    "## 2026-08-04 — D040 — Use a two-stage server-authoritative protocol for direct masking from processed text",\n    \'\'\'## 2026-08-04 — D040 — Use a two-stage server-authoritative protocol for direct masking from processed text',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f"Expected operator marker not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python ops/apply_processed_text_selection_masking_contract.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/tests.yml
          rm ops/apply_processed_text_selection_masking_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate processed-text selection masking contract"
          git push origin HEAD:scrub-processed-text-selection-masking-contract

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf

      - name: Run regression tests
        run: |
          python -m pytest -q tests
