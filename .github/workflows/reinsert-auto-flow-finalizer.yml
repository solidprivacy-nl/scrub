name: Reinsert auto-flow finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'scrub-mvp-reinsert-auto-flow-simplification'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-reinsert-auto-flow-simplification
          fetch-depth: 0

      - name: Apply governance finalisation
        run: python scripts/finalize_mvp_reinsert_auto_flow.py

      - name: Remove one-time finalizer and generated cache
        shell: bash
        run: |
          rm -f scripts/finalize_mvp_reinsert_auto_flow.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit finalised workpackage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-workpackage-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize MVP reinsert automatic flow simplification'
            git push origin HEAD:scrub-mvp-reinsert-auto-flow-simplification
          fi
