name: MVP Scrub Key binding contract operator

on:
  push:
    branches:
      - scrub-mvp-scrub-key-binding-contract-tests

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Record Scrub Key binding contract validation'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out contract branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-scrub-key-binding-contract-tests
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run contract validation
        run: |
          python -m pytest -q \
            tests/test_mvp_scrub_key_binding_contracts.py \
            tests/test_scrub_key_secure_import_export.py \
            tests/test_mvp_scrub_key_document_binding_gap_triage.py \
            tests/test_mvp_scrub_key_document_binding_gap_triage_validation.py \
            tests/test_mvp_scrub_key_roundtrip_validation.py \
            tests/test_mvp_scrub_key_roundtrip_report_contract.py

      - name: Record contract validation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/validation
          cat > output/validation/mvp_scrub_key_binding_contract_validation.json <<'JSON'
          {
            "workpackage": "SCRUB-WP_MVP_SCRUB_KEY_BINDING_CONTRACT_TESTS",
            "status": "contract_validation_passed",
            "contract_schema": "solidprivacy.scrub_key_binding_contract",
            "contract_schema_version": "1.0",
            "proposed_bound_key_schema_version": "1.1",
            "binding_id_pattern": "^B[A-Z2-7]{16}$",
            "binding_payload_entropy_bits": 80,
            "mapping_digest_algorithm": "sha256",
            "legacy_v1_status_explicit": true,
            "fail_closed_statuses_locked": 6,
            "three_step_reinsert_ux_preserved": true,
            "implementation_authorized": false,
            "product_code_changed": false,
            "production_ready": false,
            "human_review_required": true,
            "next_workpackage": "SCRUB-WP_MVP_SCRUB_KEY_BINDING_MODEL_IMPLEMENTATION"
          }
          JSON
          git config user.name 'solidprivacy-binding-contract-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add output/validation/mvp_scrub_key_binding_contract_validation.json
          git commit -m 'Record Scrub Key binding contract validation'
          git push origin HEAD:scrub-mvp-scrub-key-binding-contract-tests
