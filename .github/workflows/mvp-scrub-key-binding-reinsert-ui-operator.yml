name: MVP Scrub Key binding reinsert UI operator

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.event.pull_request.head.ref == 'scrub-mvp-scrub-key-binding-reinsert-integration'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out reinsert branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-scrub-key-binding-reinsert-integration
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf streamlit pandas
      - name: Apply minimal status UI patch
        run: python scripts/implement_scrub_key_binding_reinsert_ui.py
      - name: Capture targeted validation
        shell: bash
        run: |
          set +e
          mkdir -p output/validation
          log=output/validation/mvp_scrub_key_binding_reinsert_ui_operator.log
          : > "$log"
          python -m py_compile \
            scrub_key_import.py \
            scrub_key_reinsert.py \
            scrub_key_document_reinsert.py \
            scrub_key_binding_reinsert_status.py \
            reinsert_mode_ui.py >> "$log" 2>&1
          status=$?
          if [[ $status -eq 0 ]]; then
            python -m pytest -q \
              tests/test_scrub_key_binding_reinsert_integration.py \
              tests/test_scrub_key_binding_reinsert_status.py \
              tests/test_scrub_key_binding_reinsert_ui.py \
              tests/test_scrub_key_secure_import_export.py \
              tests/test_scrub_key_document_reinsert.py \
              tests/test_mvp_document_hygiene_fidelity_hardening.py \
              tests/test_reinsert_auto_flow.py \
              tests/test_reinsert_auto_flow_ui.py >> "$log" 2>&1
            status=$?
          fi
          if [[ $status -eq 0 ]]; then
            git diff --check >> "$log" 2>&1
            status=$?
          fi
          echo "validation_status=$status" >> "$log"
          exit 0
      - name: Remove one-time patch script and caches
        run: |
          rm -f scripts/implement_scrub_key_binding_reinsert_ui.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Commit UI integration and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-binding-reinsert-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Scrub Key binding status into reinsert UI'
          git push origin HEAD:scrub-mvp-scrub-key-binding-reinsert-integration
