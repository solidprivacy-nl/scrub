name: Fix Dutch care recognizer contract gaps

on:
  push:
    branches:
      - scrub-care-profile-recognizer-implementation
    paths:
      - ops/fix_dutch_care_recognizer_contract_gaps.py
      - .github/workflows/fix-dutch-care-recognizer-contract-gaps.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrub-care-profile-recognizer-implementation
          fetch-depth: 0
      - run: python ops/fix_dutch_care_recognizer_contract_gaps.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dutch_care_recognizers.py ops/fix_dutch_care_recognizer_contract_gaps.py .github/workflows/fix-dutch-care-recognizer-contract-gaps.yml
          git commit -m "Fix bounded Zorgfilter recognizer gaps"
          git push origin HEAD:scrub-care-profile-recognizer-implementation
