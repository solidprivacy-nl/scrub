name: Premium app shell diagnostics

on:
  push:
    branches:
      - wp/premium-app-shell-implementation
    paths:
      - .github/workflows/premium-app-shell-diagnostics.yml

permissions:
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp/premium-app-shell-implementation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf
      - name: Post concise failure summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests --tb=no > /tmp/premium-pytest.txt 2>&1
          status=$?
          set -e
          {
            echo "## Premium App Shell concise diagnostic"
            echo
            echo "Head: \`$(git rev-parse HEAD)\`"
            echo "Pytest exit: \`$status\`"
            echo
            echo '```text'
            grep -E '^(FAILED |ERROR |[0-9]+ failed|[0-9]+ passed|=+.*(failed|passed).*=+$)' /tmp/premium-pytest.txt || true
            tail -n 8 /tmp/premium-pytest.txt
            echo '```'
          } > /tmp/issue-comment.md
          gh issue comment 84 --repo solidprivacy-nl/scrub --body-file /tmp/issue-comment.md
