name: Apply Zorgfilter review-status UI fix

on:
  push:
    branches:
      - scrub-care-profile-current-ui-integration
    paths:
      - .github/workflows/apply-care-review-status-ui-fix.yml
      - ops/apply_care_review_status_ui_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: scrub-care-profile-current-ui-integration
          fetch-depth: 0

      - name: Apply targeted review-status fix
        run: python ops/apply_care_review_status_ui_fix.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No review-status changes to commit"
            exit 1
          fi
          git commit -m "Align Zorgfilter review status with selected-review policy"
          git push origin HEAD:scrub-care-profile-current-ui-integration
