name: Reinsert auto-flow diagnostic

on:
  push:
    branches:
      - scrub-mvp-reinsert-auto-flow-simplification

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'Record reinsert auto-flow diagnostic log'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-reinsert-auto-flow-simplification
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf streamlit pandas

      - name: Capture first regression failure
        shell: bash
        run: |
          set +e
          mkdir -p output/validation
          python -m pytest -q -x tests > output/validation/reinsert_auto_flow_diagnostic.log 2>&1
          status=$?
          echo "pytest_status=${status}" >> output/validation/reinsert_auto_flow_diagnostic.log
          exit 0

      - name: Commit diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-diagnostic-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add output/validation/reinsert_auto_flow_diagnostic.log
          git commit -m 'Record reinsert auto-flow diagnostic log'
          git push origin HEAD:scrub-mvp-reinsert-auto-flow-simplification
