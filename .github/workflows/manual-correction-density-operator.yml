name: Manual correction density operator

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: scrub-manual-correction-panel-density-implementation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Apply narrow implementation
        run: python scripts/manual_correction_density_worker.py

      - name: Run required validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile presidio_streamlit.py
          python -m pytest -q tests/test_manual_correction_panel_density_implementation.py
          python -m pytest -q \
            tests/test_review_export_vertical_density_contracts.py \
            tests/test_review_surface_simplification_implementation.py \
            tests/test_basic_mode_declutter_implementation.py \
            tests/test_execution_interface_simplification_ui.py \
            tests/test_duplicate_input_surface_simplification_contracts.py
          mapfile -t MANUAL_TESTS < <(find tests -maxdepth 1 -type f | grep -E 'manual.*mask|mask.*manual' | sort)
          if ((${#MANUAL_TESTS[@]})); then
            python -m pytest -q "${MANUAL_TESTS[@]}"
          fi
          git diff --check

      - name: Commit implementation when needed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __pycache__ tests/__pycache__
          if git diff --quiet; then
            echo 'Implementation already committed; nothing to push.'
            exit 0
          fi
          git config user.name 'solidprivacy-workpackage-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            presidio_streamlit.py \
            tests/test_manual_correction_panel_density_implementation.py \
            CHANGELOG.md \
            WORKPACKAGES.md \
            RELEASE_NOTES.md \
            workpackage_claims/scrub_wp_manual_correction_panel_density_simplification_implementation.md \
            handover/workpackages/20260716_2040_manual_correction_panel_density_implementation.md
          git commit -m 'Simplify manual correction panel density'
          git push origin HEAD:scrub-manual-correction-panel-density-implementation
