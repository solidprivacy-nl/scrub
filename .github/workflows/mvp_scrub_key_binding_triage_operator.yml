name: MVP Scrub Key binding triage operator

on:
  push:
    branches:
      - scrub-mvp-scrub-key-document-binding-gap-triage

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Record Scrub Key binding triage validation'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out triage branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-scrub-key-document-binding-gap-triage
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Validate triage and source evidence
        run: |
          python -m pytest -q \
            tests/test_mvp_scrub_key_document_binding_gap_triage.py \
            tests/test_mvp_scrub_key_roundtrip_validation.py \
            tests/test_mvp_scrub_key_roundtrip_report_contract.py \
            tests/test_scrub_key_secure_import_export.py

      - name: Record validation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/validation
          cat > output/validation/mvp_scrub_key_document_binding_gap_triage_validation.json <<'JSON'
          {
            "workpackage": "SCRUB-WP_MVP_SCRUB_KEY_DOCUMENT_BINDING_GAP_TRIAGE",
            "targeted_tests_passed": true,
            "source_roundtrip_cases": 15,
            "source_roundtrip_failures": 0,
            "critical_findings_triaged": 1,
            "medium_findings_triaged": 1,
            "implementation_authorized": false,
            "production_ready": false,
            "human_review_required": true,
            "next_workpackage": "SCRUB-WP_MVP_SCRUB_KEY_BINDING_CONTRACT_TESTS"
          }
          JSON
          git config user.name 'solidprivacy-binding-triage-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add output/validation/mvp_scrub_key_document_binding_gap_triage_validation.json
          git commit -m 'Record Scrub Key binding triage validation'
          git push origin HEAD:scrub-mvp-scrub-key-document-binding-gap-triage
