name: MVP Phase 6 validation matrix operator

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

permissions:
  contents: write

jobs:
  generate-validate-and-finalize:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-e2e-synthetic-validation-matrix
          fetch-depth: 0

      - name: Correct reserved synthetic email fixture when needed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path('test_cases/mvp_phase6/validation_manifest.json')
          test_path = Path('tests/test_mvp_phase6_e2e_synthetic_validation_matrix.py')
          claim_path = Path('workpackage_claims/scrub_wp_mvp_e2e_synthetic_validation_matrix.md')

          manifest = manifest_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')
          changed = False

          if 'mila.testerveld@example.invalid' in manifest:
              manifest = manifest.replace(
                  'mila.testerveld@example.invalid',
                  'mila.testerveld@example.com',
              )
              manifest_path.write_text(manifest, encoding='utf-8')
              changed = True

          if 'mila.testerveld@example.invalid' in tests:
              tests = tests.replace(
                  'mila.testerveld@example.invalid',
                  'mila.testerveld@example.com',
              )
              tests = tests.replace(
                  'for prohibited in ["Jan Jansen", "Piet de Vries", "example.com"]:',
                  'for prohibited in ["Jan Jansen", "Piet de Vries"]:',
              )
              test_path.write_text(tests, encoding='utf-8')
              changed = True

          if changed:
              claim = claim_path.read_text(encoding='utf-8')
              claim = re.sub(
                  r'^Status: .+$',
                  'Status: in_progress',
                  claim,
                  count=1,
                  flags=re.MULTILINE,
              )
              claim = claim.split('\n\nValidation result:', 1)[0].rstrip() + '\n'
              if 'Reserved fixture correction:' not in claim:
                  claim += (
                      '\nReserved fixture correction:\n'
                      '- Replaced `.invalid` with IANA-reserved `example.com` so the standard Presidio email recognizer can be assessed without real personal data.\n'
                  )
              claim_path.write_text(claim, encoding='utf-8')
          PY

      - name: Check whether finalization is required
        id: state
        shell: bash
        run: |
          if grep -q '^Status: in_progress$' workpackage_claims/scrub_wp_mvp_e2e_synthetic_validation_matrix.md; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.state.outputs.required == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install validation dependencies
        if: steps.state.outputs.required == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf

      - name: Compile Phase 6 helpers
        if: steps.state.outputs.required == 'true'
        run: |
          python -m py_compile \
            mvp_phase6_validation_manifest.py \
            mvp_phase6_detection_matrix.py \
            mvp_phase6_workflow_core.py \
            mvp_phase6_document_cases.py \
            mvp_phase6_validation_report.py \
            scripts/run_mvp_phase6_validation_matrix.py \
            scripts/reconcile_mvp_phase6_validation_evidence.py

      - name: Run focused and related validation tests
        if: steps.state.outputs.required == 'true'
        run: |
          python -m pytest -q \
            tests/test_mvp_phase6_e2e_synthetic_validation_matrix.py \
            tests/test_dutch_legal_recall_gap_baseline.py \
            tests/test_scrub_key.py \
            tests/test_scrub_key_reinsert.py \
            tests/test_scrub_key_document_reinsert.py

      - name: Generate corrected machine-readable baseline
        if: steps.state.outputs.required == 'true'
        run: python scripts/run_mvp_phase6_validation_matrix.py

      - name: Reconcile corrected governance evidence
        if: steps.state.outputs.required == 'true'
        run: python scripts/reconcile_mvp_phase6_validation_evidence.py

      - name: Validate final scope and report
        if: steps.state.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report_path = Path('output/validation/mvp_phase6_synthetic_validation_report.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          assert report['schema'] == 'solidprivacy.mvp_phase6_validation_report'
          assert report['case_count'] == 3
          assert report['failing_case_count'] == 0
          assert report['synthetic_data_only'] is True
          assert report['human_review_required'] is True
          assert report['production_ready'] is False
          assert report['production_readiness_claim'] is False
          assert report['local_only'] is True
          assert report['ai_processing'] is False
          assert report['cloud_processing'] is False
          assert report['ocr_processing'] is False
          txt_case = next(item for item in report['cases'] if item['id'] == 'txt_legal_core_roundtrip')
          assert txt_case['detection']['detection_expectations_met'] is True
          assert txt_case['detection']['missing_expected_values'] == []
          categories = {item['category'] for item in report['evidence_gaps']}
          assert categories == {
              'known_docx_reinsert_limitation',
              'known_pdf_reinsert_limitation',
          }

          allowed = {
              'CHANGELOG.md',
              'RISK_REGISTER.md',
              'WORKPACKAGES.md',
              'handover/workpackages/20260717_2020_mvp_e2e_synthetic_validation_matrix.md',
              'output/validation/mvp_phase6_synthetic_validation_report.json',
              'test_cases/mvp_phase6/validation_manifest.json',
              'tests/test_mvp_phase6_e2e_synthetic_validation_matrix.py',
              'workpackage_claims/scrub_wp_mvp_e2e_synthetic_validation_matrix.md',
          }
          changed = set(
              subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          )
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected generated/finalized files: {sorted(unexpected)}')
          PY

      - name: Commit corrected evidence when needed
        if: steps.state.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-workpackage-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            CHANGELOG.md \
            RISK_REGISTER.md \
            WORKPACKAGES.md \
            output/validation/mvp_phase6_synthetic_validation_report.json \
            test_cases/mvp_phase6/validation_manifest.json \
            tests/test_mvp_phase6_e2e_synthetic_validation_matrix.py \
            workpackage_claims/scrub_wp_mvp_e2e_synthetic_validation_matrix.md \
            handover/workpackages/20260717_2020_mvp_e2e_synthetic_validation_matrix.md
          git commit -m 'Correct MVP Phase 6 synthetic email evidence'
          git push origin HEAD:scrub-mvp-e2e-synthetic-validation-matrix
