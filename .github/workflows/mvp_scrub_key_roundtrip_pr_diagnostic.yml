name: MVP Scrub Key roundtrip PR diagnostic

on:
  push:
    branches:
      - scrub-mvp-scrub-key-roundtrip-validation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-scrub-key-roundtrip-validation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf streamlit pandas

      - name: Capture first regression failure
        shell: bash
        run: |
          set +e
          python -m pytest -q -x tests > /tmp/mvp_scrub_key_roundtrip_pr_diagnostic.log 2>&1
          status=$?
          echo "pytest_status=${status}" >> /tmp/mvp_scrub_key_roundtrip_pr_diagnostic.log
          exit 0

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: mvp-scrub-key-roundtrip-pr-diagnostic
          path: /tmp/mvp_scrub_key_roundtrip_pr_diagnostic.log
          retention-days: 1
