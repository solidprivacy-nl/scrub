name: Generate Zorgfilter cross-profile matrix artifact

on:
  push:
    branches:
      - scrub-care-profile-cross-profile-regression-matrix
    paths:
      - ops/generate_care_profile_cross_profile_matrix_artifact.py
      - .github/workflows/generate-care-profile-cross-profile-matrix.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: scrub-care-profile-cross-profile-regression-matrix
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install matrix dependencies
        run: python -m pip install presidio-analyzer

      - name: Generate artifact
        run: python ops/generate_care_profile_cross_profile_matrix_artifact.py

      - name: Commit artifact and self-cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 1
          fi
          git commit -m "Record Zorgfilter cross-profile regression matrix"
          git push origin HEAD:scrub-care-profile-cross-profile-regression-matrix
