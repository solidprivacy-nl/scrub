name: Bound placeholder display compaction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply display-only UI integration
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B scrub-bound-placeholder-display-compaction origin/scrub-bound-placeholder-display-compaction
          python - <<'PY'
          from pathlib import Path
          path = Path("ops/implement_bound_placeholder_display_compaction.py")
          text = path.read_text(encoding="utf-8")
          start_marker = '''patch(\n    "side_by_side_review_panel_ui.py",\n    """.sp-side-by-side-highlight-token'''
          end_marker = '''\n\npatch(\n    "side_by_side_review_panel_ui.py",\n    \'\'\'def _highlighted_processed_inner_html'''
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("CSS patch block anchors not found")
          path.write_text(text[:start] + text[end + 2 :], encoding="utf-8")
          PY
          python ops/implement_bound_placeholder_display_compaction.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate compact bound placeholder display"
          git push origin HEAD:scrub-bound-placeholder-display-compaction

      - name: Run frontend display and component tests
        run: |
          node --test tests/frontend/bound_placeholder_display.test.js
          node --test tests/frontend/processed_text_selection_component_core.test.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf

      - name: Run full regression
        run: python -m pytest -q tests
