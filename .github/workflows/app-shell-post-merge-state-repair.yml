name: Apply App Shell post-merge state repair

on:
  push:
    branches:
      - wp/premium-app-shell-post-merge-state-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp/premium-app-shell-post-merge-state-repair
          fetch-depth: 0
      - name: Patch cross-mode runtime state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def block(lines):
              return "\n".join(lines) + "\n"

          state_path = Path("premium_streamlit_state.py")
          state = state_path.read_text(encoding="utf-8")

          old = 'ANALYZER_PARAMS_KEY = "_premium_analyzer_params"\n'
          new = block([
              'ANALYZER_PARAMS_KEY = "_premium_analyzer_params"',
              'SOURCE_TEXT_KEY = "_premium_cached_text"',
              'REVIEW_ROWS_KEY = "_premium_cached_review_rows"',
              'REVIEW_ROWS_GENERATION_KEY = "_premium_review_rows_generation"',
          ])
          assert old in state
          state = state.replace(old, new, 1)

          old = block([
              '    if workflow is not previous_workflow:',
              '        session_state.pop(ANALYSIS_GENERATION_KEY, None)',
              '        session_state.pop(ANALYSIS_RESULTS_KEY, None)',
              '        session_state.pop(STAGE_SUMMARIES_KEY, None)',
          ])
          new = block([
              '    if workflow is not previous_workflow:',
              '        session_state.pop(ANALYSIS_GENERATION_KEY, None)',
              '        session_state.pop(ANALYSIS_RESULTS_KEY, None)',
              '        session_state.pop(REVIEW_ROWS_KEY, None)',
              '        session_state.pop(REVIEW_ROWS_GENERATION_KEY, None)',
              '        session_state.pop(STAGE_SUMMARIES_KEY, None)',
          ])
          assert old in state
          state = state.replace(old, new, 1)

          marker = "\n\ndef processing_generation(\n"
          insert = block([
              '',
              'def stored_source_text(session_state: Mapping[str, Any], default: str = "") -> str:',
              '    """Return the current authoritative source text in either presentation mode."""',
              '    value = session_state.get(SOURCE_TEXT_KEY, default)',
              '    return str(value) if value is not None else str(default)',
              '',
              '',
              'def _stable_review_value(value: Any) -> Any:',
              '    """Normalize dataframe scalar values only for deterministic row comparison."""',
              '    if value is None:',
              '        return None',
              '    try:',
              '        if value != value:',
              '            return None',
              '    except Exception:',
              '        pass',
              '    if isinstance(value, (str, int, float, bool)):',
              '        return value',
              '    return str(value)',
              '',
              '',
              'def review_rows_signature(rows: Sequence[Mapping[str, Any]]) -> str:',
              '    """Return a deterministic signature without changing the cached row payload."""',
              '    normalized = []',
              '    for row in rows:',
              '        normalized.append({',
              '            str(key): _stable_review_value(value)',
              '            for key, value in sorted(row.items(), key=lambda item: str(item[0]))',
              '        })',
              '    return json.dumps(normalized, ensure_ascii=False, sort_keys=True, separators=(",", ":"))',
              '',
              '',
              'def review_rows_changed(',
              '    previous_rows: Sequence[Mapping[str, Any]], current_rows: Sequence[Mapping[str, Any]]',
              ') -> bool:',
              '    """Detect a real review decision/edit change while tolerating NaN-like values."""',
              '    return review_rows_signature(previous_rows) != review_rows_signature(current_rows)',
              '',
              '',
              'def cache_review_rows(',
              '    session_state: MutableMapping[str, Any],',
              '    generation: str,',
              '    rows: Sequence[Mapping[str, Any]],',
              ') -> None:',
              '    """Persist the authoritative review working set for exactly one generation."""',
              '    session_state[REVIEW_ROWS_GENERATION_KEY] = str(generation)',
              '    session_state[REVIEW_ROWS_KEY] = [dict(row) for row in rows]',
              '',
              '',
              'def get_cached_review_rows(',
              '    session_state: Mapping[str, Any], generation: str',
              ') -> Optional[list[dict[str, Any]]]:',
              '    """Return defensive review-row copies only when their generation is current."""',
              '    if session_state.get(REVIEW_ROWS_GENERATION_KEY) != generation:',
              '        return None',
              '    rows = session_state.get(REVIEW_ROWS_KEY)',
              '    if not isinstance(rows, list):',
              '        return None',
              '    if not all(isinstance(row, Mapping) for row in rows):',
              '        return None',
              '    return [dict(row) for row in rows]',
          ])
          assert marker in state
          state = state.replace(marker, insert + marker, 1)

          old = block([
              '    session_state.pop(STAGE_SUMMARIES_KEY, None)',
              '    session_state.pop(ANALYSIS_GENERATION_KEY, None)',
              '    session_state.pop(ANALYSIS_RESULTS_KEY, None)',
              '    return state, True',
          ])
          new = block([
              '    session_state.pop(STAGE_SUMMARIES_KEY, None)',
              '    session_state.pop(ANALYSIS_GENERATION_KEY, None)',
              '    session_state.pop(ANALYSIS_RESULTS_KEY, None)',
              '    session_state.pop(REVIEW_ROWS_KEY, None)',
              '    session_state.pop(REVIEW_ROWS_GENERATION_KEY, None)',
              '    return state, True',
          ])
          assert old in state
          state = state.replace(old, new, 1)
          state_path.write_text(state, encoding="utf-8")

          app_path = Path("presidio_streamlit.py")
          app = app_path.read_text(encoding="utf-8")

          old = block([
              '    analyzer_model_label,',
              '    cache_analysis_results,',
              '    get_cached_analysis_results,',
              '    get_core_flow_state,',
              '    mark_processing_complete,',
              '    mark_review_complete,',
              '    persist_processing_settings,',
              '    processing_generation,',
              '    set_stage_summary,',
              '    stored_analyzer_params,',
              '    stored_entities,',
              '    stored_operator_value,',
              '    stored_profile_label,',
              '    stored_string_list,',
              '    stored_threshold,',
              '    synchronize_processing_generation,',
              '    synchronize_shell_choices,',
          ])
          new = block([
              '    analyzer_model_label,',
              '    cache_analysis_results,',
              '    cache_review_rows,',
              '    get_cached_analysis_results,',
              '    get_cached_review_rows,',
              '    get_core_flow_state,',
              '    mark_processing_complete,',
              '    mark_review_complete,',
              '    persist_processing_settings,',
              '    processing_generation,',
              '    review_rows_changed,',
              '    select_stage,',
              '    set_stage_summary,',
              '    stored_analyzer_params,',
              '    stored_entities,',
              '    stored_operator_value,',
              '    stored_profile_label,',
              '    stored_source_text,',
              '    stored_string_list,',
              '    stored_threshold,',
              '    synchronize_processing_generation,',
              '    synchronize_shell_choices,',
          ])
          assert old in app
          app = app.replace(old, new, 1)

          old = block([
              '        uploaded_file = st.file_uploader(',
              '            "Upload een .txt-, .docx- of tekstgebaseerd .pdf-bestand",',
              '            type=["txt", "docx", "pdf"],',
              '            help="Gebruik in deze publieke prototypeomgeving alleen synthetische of goedgekeurde testdocumenten.",',
              '        )',
              '        if uploaded_file is None and is_premium_standard:',
              '            uploaded_file = st.session_state.get("_premium_cached_uploaded_file")',
              '            if uploaded_file is not None:',
              '                st.caption(f"Huidige bron: {uploaded_file.name}")',
              '',
              '        uploaded_file_type = (',
              '            st.session_state.get("_premium_cached_uploaded_file_type")',
              '            if is_premium_standard and uploaded_file is not None',
              '            else None',
              '        )',
              '        input_text = (',
              '            st.session_state.get("_premium_cached_text", "".join(demo_text))',
              '            if is_premium_standard',
              '            else "".join(demo_text)',
              '        )',
          ])
          new = block([
              '        new_uploaded_file = st.file_uploader(',
              '            "Upload een .txt-, .docx- of tekstgebaseerd .pdf-bestand",',
              '            type=["txt", "docx", "pdf"],',
              '            help="Gebruik in deze publieke prototypeomgeving alleen synthetische of goedgekeurde testdocumenten.",',
              '        )',
              '        cached_uploaded_file = st.session_state.get("_premium_cached_uploaded_file")',
              '        uploaded_file = new_uploaded_file if new_uploaded_file is not None else cached_uploaded_file',
              '        if new_uploaded_file is None and cached_uploaded_file is not None:',
              '            st.caption(f"Huidige bron: {cached_uploaded_file.name}")',
              '',
              '        uploaded_file_type = (',
              '            None',
              '            if new_uploaded_file is not None',
              '            else st.session_state.get("_premium_cached_uploaded_file_type")',
              '        )',
              '        input_text = stored_source_text(st.session_state, "".join(demo_text))',
          ])
          assert old in app
          app = app.replace(old, new, 1)

          old = block([
              '    cached_analysis_results = None',
              '    if is_premium_standard and not stage_is_active(premium_state, Stage.ADD):',
              '        cached_analysis_results = get_cached_analysis_results(',
              '            st.session_state, current_processing_generation',
              '        )',
          ])
          new = block([
              '    cached_analysis_results = get_cached_analysis_results(',
              '        st.session_state, current_processing_generation',
              '    )',
          ])
          assert old in app
          app = app.replace(old, new, 1)

          old = block([
              '        if is_premium_standard:',
              '            cache_analysis_results(',
              '                st.session_state,',
              '                current_processing_generation,',
              '                st_analyze_results,',
              '            )',
          ])
          new = block([
              '        cache_analysis_results(',
              '            st.session_state,',
              '            current_processing_generation,',
              '            st_analyze_results,',
              '        )',
          ])
          assert old in app
          app = app.replace(old, new, 1)

          old = block([
              '        replacement_editor_df = pd.DataFrame(default_editor_rows)',
              '        if is_premium_standard and stage_is_active(premium_state, Stage.REVIEW):',
              '            cached_review_rows = st.session_state.get("_premium_cached_review_rows")',
              '            if isinstance(cached_review_rows, list) and cached_review_rows:',
              '                cached_review_df = pd.DataFrame(cached_review_rows)',
              '                if "find" in cached_review_df.columns and "find" in replacement_editor_df.columns:',
              '                    cached_find_values = {',
              '                        safe_cell(value) for value in cached_review_df["find"].tolist()',
              '                    }',
              '                    new_rows_df = replacement_editor_df[',
              '                        ~replacement_editor_df["find"].map(safe_cell).isin(cached_find_values)',
              '                    ]',
              '                    replacement_editor_df = pd.concat(',
              '                        [cached_review_df, new_rows_df], ignore_index=True',
              '                    )',
              '                else:',
              '                    replacement_editor_df = cached_review_df',
          ])
          new = block([
              '        replacement_editor_df = pd.DataFrame(default_editor_rows)',
              '        cached_review_rows = get_cached_review_rows(',
              '            st.session_state, current_processing_generation',
              '        )',
              '        if cached_review_rows:',
              '            cached_review_df = pd.DataFrame(cached_review_rows)',
              '            if "find" in cached_review_df.columns and "find" in replacement_editor_df.columns:',
              '                cached_find_values = {',
              '                    safe_cell(value) for value in cached_review_df["find"].tolist()',
              '                }',
              '                new_rows_df = replacement_editor_df[',
              '                    ~replacement_editor_df["find"].map(safe_cell).isin(cached_find_values)',
              '                ]',
              '                replacement_editor_df = pd.concat(',
              '                    [cached_review_df, new_rows_df], ignore_index=True',
              '                )',
              '            else:',
              '                replacement_editor_df = cached_review_df',
          ])
          assert old in app
          app = app.replace(old, new, 1)

          old = block([
              '                if is_premium_standard:',
              '                    st.session_state["_premium_cached_review_rows"] = (',
              '                        edited_replacements_df.to_dict("records")',
              '                    )',
          ])
          new = block([
              '                edited_review_records = edited_replacements_df.to_dict("records")',
              '                review_working_set_changed = (',
              '                    cached_review_rows is not None',
              '                    and review_rows_changed(cached_review_rows, edited_review_records)',
              '                )',
              '                cache_review_rows(',
              '                    st.session_state,',
              '                    current_processing_generation,',
              '                    edited_review_records,',
              '                )',
              '                if review_working_set_changed and (',
              '                    premium_state.reviewed_generation is not None',
              '                    or premium_state.export_generation is not None',
              '                ):',
              '                    premium_state = select_stage(st.session_state, Stage.REVIEW)',
              '                    set_stage_summary(st.session_state, Stage.REVIEW, "")',
          ])
          assert old in app
          app = app.replace(old, new, 1)

          old = block([
              '        else:',
              '            cached_review_rows = st.session_state.get("_premium_cached_review_rows")',
              '            if not isinstance(cached_review_rows, list) or not cached_review_rows:',
              '                st.error("De afgeronde controle is niet meer beschikbaar. Open Controleren opnieuw.")',
              '                st.stop()',
              '            edited_replacements_df = pd.DataFrame(cached_review_rows)',
          ])
          new = block([
              '        else:',
              '            cached_review_rows = get_cached_review_rows(',
              '                st.session_state, current_processing_generation',
              '            )',
              '            if not cached_review_rows:',
              '                st.error("De afgeronde controle is niet meer beschikbaar. Open Controleren opnieuw.")',
              '                st.stop()',
              '            edited_replacements_df = pd.DataFrame(cached_review_rows)',
          ])
          assert old in app
          app = app.replace(old, new, 1)

          old = block([
              '                st.session_state["_premium_cached_review_rows"] = edited_replacements_df.to_dict("records")',
              '                manual_count = 0',
          ])
          new = block([
              '                cache_review_rows(',
              '                    st.session_state,',
              '                    current_processing_generation,',
              '                    edited_replacements_df.to_dict("records"),',
              '                )',
              '                manual_count = 0',
          ])
          assert old in app
          app = app.replace(old, new, 1)
          app_path.write_text(app, encoding="utf-8")
          PY
          python -m py_compile premium_streamlit_state.py presidio_streamlit.py
      - name: Commit repair and self-clean workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/app-shell-post-merge-state-repair.yml
          git add premium_streamlit_state.py presidio_streamlit.py .github/workflows/app-shell-post-merge-state-repair.yml
          git commit -m "fix(ui): preserve cross-mode source and review state"
          git push origin HEAD:wp/premium-app-shell-post-merge-state-repair
