name: Apply AI-first desktop packaging governance

on:
  push:
    branches:
      - scrub-ai-first-desktop-packaging-roadmap-alignment
    paths:
      - scripts/apply_ai_first_desktop_packaging_governance.py
      - .github/workflows/ai_first_desktop_packaging_governance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrub-ai-first-desktop-packaging-roadmap-alignment
          fetch-depth: 0

      - name: Apply governance updates
        run: python scripts/apply_ai_first_desktop_packaging_governance.py

      - name: Remove temporary operator
        run: |
          rm scripts/apply_ai_first_desktop_packaging_governance.py
          rm .github/workflows/ai_first_desktop_packaging_governance.yml

      - name: Commit finalized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md AI_FIRST_DESKTOP_PACKAGING_EXECUTION_MODEL.md DESKTOP_PACKAGING_DECISION.md DECISION_LOG.md WORKPACKAGES.md CHANGELOG.md workpackage_claims handover/workpackages scripts .github/workflows
          git diff --cached --check
          git commit -m "Record AI-first desktop packaging roadmap alignment"
          git push origin HEAD:scrub-ai-first-desktop-packaging-roadmap-alignment
