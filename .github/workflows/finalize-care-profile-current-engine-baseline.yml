name: Finalize current-engine Zorgfilter baseline

on:
  push:
    branches:
      - scrub-care-profile-current-engine-baseline
    paths:
      - ops/finalize_care_profile_current_engine_baseline.py
      - .github/workflows/finalize-care-profile-current-engine-baseline.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrub-care-profile-current-engine-baseline
          fetch-depth: 0
      - run: python ops/finalize_care_profile_current_engine_baseline.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md WORKPACKAGES.md CHANGELOG.md RISK_REGISTER.md workpackage_claims/scrub_wp_care_profile_current_engine_baseline.md ops/finalize_care_profile_current_engine_baseline.py .github/workflows/finalize-care-profile-current-engine-baseline.yml
          git commit -m "Finalize current-engine Zorgfilter baseline"
          git push origin HEAD:scrub-care-profile-current-engine-baseline
