name: MVP Scrub Key binding export operator

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.event.pull_request.head.ref == 'scrub-mvp-scrub-key-binding-export-integration'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out export integration branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-scrub-key-binding-export-integration
          fetch-depth: 0

      - name: Stop cleanly when implementation is already committed
        id: guard
        shell: bash
        run: |
          if [[ -f scripts/implement_scrub_key_binding_export_integration.py ]]; then
            echo 'run_implementation=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_implementation=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.run_implementation == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        if: steps.guard.outputs.run_implementation == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf streamlit pandas

      - name: Apply helper-first export integration
        if: steps.guard.outputs.run_implementation == 'true'
        run: python scripts/implement_scrub_key_binding_export_integration.py

      - name: Run targeted validation
        if: steps.guard.outputs.run_implementation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            document_tools.py \
            manual_mask_entry.py \
            scrub_key_bound_export.py \
            presidio_streamlit.py
          python -m pytest -q \
            tests/test_scrub_key_bound_export.py \
            tests/test_mvp_scrub_key_binding_export_integration.py \
            tests/test_scrub_key_binding_model.py \
            tests/test_mvp_scrub_key_binding_contracts.py \
            tests/test_scrub_key_secure_import_export.py \
            tests/test_manual_mask_entry.py \
            tests/test_document_tools.py \
            tests/test_review_export_vertical_density_contracts.py \
            tests/test_mvp_scrub_key_roundtrip_validation.py
          git diff --check

      - name: Commit implementation
        if: steps.guard.outputs.run_implementation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/implement_scrub_key_binding_export_integration.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'solidprivacy-binding-export-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate document binding into Scrub Key export'
          git push origin HEAD:scrub-mvp-scrub-key-binding-export-integration
