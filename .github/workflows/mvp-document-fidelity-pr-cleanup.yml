name: MVP document fidelity PR cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'scrub-mvp-document-hygiene-fidelity-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-document-hygiene-fidelity-hardening
          fetch-depth: 0

      - name: Run cleanup
        run: python scripts/finalize_mvp_document_fidelity_pr_cleanup.py

      - name: Validate and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -f scripts/finalize_mvp_document_fidelity_pr_cleanup.py
          test ! -f scripts/patch_docx_reinsert_capability_copy_only.py
          python - <<'PY'
          from pathlib import Path
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          workpackages = Path('WORKPACKAGES.md').read_text(encoding='utf-8')
          handover = Path('handover/workpackages/20260717_2230_mvp_document_hygiene_fidelity_hardening.md').read_text(encoding='utf-8')
          assert changelog.count('- `tests/test_mvp_document_fidelity_ui_copy.py`') == 1
          assert changelog.count('The DOCX reinsert capability copy now matches') == 1
          assert workpackages.count('Aligned the existing DOCX reinsert information copy') == 1
          assert handover.count('- `tests/test_mvp_document_fidelity_ui_copy.py`') == 1
          assert handover.count('Source-level DOCX/PDF capability-copy contract tests.') == 1
          PY
          git config user.name 'solidprivacy-workpackage-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Clean document fidelity PR evidence'
          git push origin HEAD:scrub-mvp-document-hygiene-fidelity-hardening
