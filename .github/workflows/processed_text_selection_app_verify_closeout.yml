name: Processed-text selection app verify closeout

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply closeout atomically on feature branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B scrub-processed-text-selection-app-verify-closeout origin/scrub-processed-text-selection-app-verify-closeout
          python - <<'PY'
          from pathlib import Path
          path = Path("ops/finalize_processed_text_selection_app_verify_closeout.py")
          text = path.read_text(encoding="utf-8")
          old = "Merge after the final documentation-only PR run is green. Then verify GitHub-to-Hugging-Face synchronization and request focused live app verification before starting cross-flow regression."
          new = "Merge PR #63. Then verify GitHub-to-Hugging-Face synchronization and request focused live app verification before starting cross-flow regression."
          if old not in text:
              raise SystemExit("Expected finalizer anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python ops/finalize_processed_text_selection_app_verify_closeout.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Close processed-text selection app verification"
          git push origin HEAD:scrub-processed-text-selection-app-verify-closeout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf

      - name: Run regression tests
        run: python -m pytest -q tests
