name: MVP document hygiene fidelity operator

on:
  push:
    branches:
      - main
    paths:
      - operator_triggers/mvp_document_hygiene_fidelity.txt

permissions:
  contents: write

jobs:
  validate-generate-finalize:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-document-hygiene-fidelity-hardening
          fetch-depth: 0

      - name: Check whether finalization is required
        id: state
        shell: bash
        run: |
          if grep -q '^Status: in_progress$' workpackage_claims/scrub_wp_mvp_document_hygiene_fidelity_hardening.md; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.state.outputs.required == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install validation dependencies
        if: steps.state.outputs.required == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf

      - name: Validate, generate and finalize with diagnostic capture
        if: steps.state.outputs.required == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p output/validation
          LOG=output/validation/mvp_document_hygiene_fidelity_operator_failure.txt
          : > "$LOG"

          python - <<'PY' >> "$LOG" 2>&1
          from pathlib import Path

          path = Path('scrub_key_document_reinsert.py')
          text = path.read_text(encoding='utf-8')
          marker = '    "Headers and footers are processed together with the main document body.",\n'
          if marker not in text:
              anchor = '    "Normal body paragraphs, body tables and header/footer text are supported.",\n'
              if anchor not in text:
                  raise SystemExit('DOCX limitations anchor not found')
              path.write_text(text.replace(anchor, anchor + marker, 1), encoding='utf-8')
          PY
          STATUS=$?

          if [ "$STATUS" -eq 0 ]; then
            python -m py_compile \
              scrub_key_document_reinsert.py \
              mvp_phase6_document_cases.py \
              mvp_document_fidelity_report.py \
              scripts/run_mvp_document_hygiene_fidelity_report.py \
              scripts/finalize_mvp_document_hygiene_fidelity_hardening.py \
              >> "$LOG" 2>&1
            STATUS=$?
          fi

          if [ "$STATUS" -eq 0 ]; then
            python -m pytest -q \
              tests/test_mvp_document_hygiene_fidelity_hardening.py \
              tests/test_mvp_document_fidelity_report.py \
              tests/test_scrub_key_document_reinsert.py \
              tests/test_mvp_phase6_e2e_synthetic_validation_matrix.py \
              tests/test_mvp_phase6_false_negative_gap_triage.py \
              tests/test_docx_hygiene_audit.py \
              >> "$LOG" 2>&1
            STATUS=$?
          fi

          if [ "$STATUS" -eq 0 ]; then
            python scripts/run_mvp_document_hygiene_fidelity_report.py >> "$LOG" 2>&1
            STATUS=$?
          fi

          if [ "$STATUS" -eq 0 ]; then
            python scripts/finalize_mvp_document_hygiene_fidelity_hardening.py >> "$LOG" 2>&1
            STATUS=$?
          fi

          if [ "$STATUS" -eq 0 ]; then
            git diff --check >> "$LOG" 2>&1
            STATUS=$?
          fi

          if [ "$STATUS" -eq 0 ]; then
            python - <<'PY' >> "$LOG" 2>&1
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(
              Path('output/validation/mvp_phase6_document_hygiene_fidelity_hardening_report.json').read_text(encoding='utf-8')
          )
          assert report['docx_header_footer_reinsert_resolved'] is True
          assert report['resolved_finding_count'] == 1
          assert report['remaining_finding_count'] == 1
          assert report['pdf_boundary_preserved'] is True
          assert report['production_ready'] is False
          assert report['human_review_required'] is True
          assert report['ai_processing'] is False
          assert report['cloud_processing'] is False
          assert report['ocr_processing'] is False

          allowed = {
              'CHANGELOG.md',
              'DECISION_LOG.md',
              'RELEASE_NOTES.md',
              'RISK_REGISTER.md',
              'WORKPACKAGES.md',
              'handover/workpackages/20260717_2230_mvp_document_hygiene_fidelity_hardening.md',
              'output/validation/mvp_phase6_document_hygiene_fidelity_hardening_report.json',
              'output/validation/mvp_document_hygiene_fidelity_operator_failure.txt',
              'scrub_key_document_reinsert.py',
              'workpackage_claims/scrub_wp_mvp_document_hygiene_fidelity_hardening.md',
          }
          changed = set(
              subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          )
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected generated/finalized files: {sorted(unexpected)}')
          PY
            STATUS=$?
          fi

          git config user.name 'solidprivacy-workpackage-worker'
          git config user.email 'actions@users.noreply.github.com'

          if [ "$STATUS" -ne 0 ]; then
            printf '\noperator_exit_status=%s\n' "$STATUS" >> "$LOG"
            git add "$LOG" scrub_key_document_reinsert.py
            git commit -m 'Record document fidelity operator failure diagnostics' || true
            git push origin HEAD:scrub-mvp-document-hygiene-fidelity-hardening
            exit 0
          fi

          rm -f "$LOG"
          git add \
            CHANGELOG.md \
            DECISION_LOG.md \
            RELEASE_NOTES.md \
            RISK_REGISTER.md \
            WORKPACKAGES.md \
            scrub_key_document_reinsert.py \
            output/validation/mvp_phase6_document_hygiene_fidelity_hardening_report.json \
            workpackage_claims/scrub_wp_mvp_document_hygiene_fidelity_hardening.md \
            handover/workpackages/20260717_2230_mvp_document_hygiene_fidelity_hardening.md
          git commit -m 'Record MVP document fidelity hardening evidence'
          git push origin HEAD:scrub-mvp-document-hygiene-fidelity-hardening
