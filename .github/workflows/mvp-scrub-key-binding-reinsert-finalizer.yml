name: MVP Scrub Key binding reinsert finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'scrub-mvp-scrub-key-binding-reinsert-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reinsert branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-scrub-key-binding-reinsert-integration
          fetch-depth: 0
      - name: Apply governance finalisation
        run: python scripts/finalize_mvp_scrub_key_binding_reinsert_integration.py
      - name: Remove one-time finalizer and caches
        run: |
          rm -f scripts/finalize_mvp_scrub_key_binding_reinsert_integration.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Commit finalised workpackage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-binding-reinsert-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Scrub Key binding reinsert integration'
          git push origin HEAD:scrub-mvp-scrub-key-binding-reinsert-integration
