name: MVP document fidelity main merge only

on:
  push:
    branches:
      - main
    paths:
      - operator_triggers/mvp_document_fidelity_main_merge_only.txt

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-document-hygiene-fidelity-hardening
          fetch-depth: 0

      - name: Merge main and resolve known governance conflicts
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'solidprivacy-workpackage-worker'
          git config user.email 'actions@users.noreply.github.com'

          python - <<'PY'
          from pathlib import Path

          def save_prefix(path: str, next_marker: str, destination: str) -> None:
              text = Path(path).read_text(encoding='utf-8')
              index = text.find(next_marker)
              if index < 0:
                  raise SystemExit(f'Next marker missing in {path}')
              Path(destination).write_text(text[:index], encoding='utf-8')

          save_prefix(
              'CHANGELOG.md',
              '## 2026-07-17 — SCRUB-WP_MVP_FALSE_NEGATIVE_GAP_TRIAGE',
              '/tmp/fidelity_changelog.md',
          )
          save_prefix(
              'WORKPACKAGES.md',
              '## 2026-07-17 22:08 Europe/Amsterdam — SCRUB-WP_MVP_FALSE_NEGATIVE_GAP_TRIAGE',
              '/tmp/fidelity_workpackages.md',
          )
          PY

          git fetch origin main
          git merge origin/main --no-commit --no-ff || true
          unresolved=$(git diff --name-only --diff-filter=U | sort)
          if [ "$unresolved" != $'CHANGELOG.md\nWORKPACKAGES.md' ]; then
            echo 'Unexpected unresolved paths:'
            printf '%s\n' "$unresolved"
            exit 1
          fi

          git checkout --theirs CHANGELOG.md WORKPACKAGES.md
          python - <<'PY'
          from pathlib import Path

          pairs = [
              (
                  Path('CHANGELOG.md'),
                  Path('/tmp/fidelity_changelog.md'),
                  '## 2026-07-17 — SCRUB-WP_MVP_DOCUMENT_HYGIENE_FIDELITY_HARDENING',
              ),
              (
                  Path('WORKPACKAGES.md'),
                  Path('/tmp/fidelity_workpackages.md'),
                  '## 2026-07-17 22:30 Europe/Amsterdam — SCRUB-WP_MVP_DOCUMENT_HYGIENE_FIDELITY_HARDENING',
              ),
          ]
          for target, prefix_file, marker in pairs:
              current = target.read_text(encoding='utf-8')
              prefix = prefix_file.read_text(encoding='utf-8')
              if marker not in current:
                  target.write_text(prefix + current, encoding='utf-8')
          PY

          rm -f .github/workflows/mvp-document-fidelity-main-merge-only.yml
          rm -f .github/workflows/mvp-document-fidelity-main-sync.yml
          rm -f .github/workflows/mvp-document-fidelity-merge-diagnostic.yml
          rm -f operator_triggers/mvp_document_fidelity_main_merge_only.txt
          rm -f operator_triggers/mvp_document_fidelity_main_sync.txt
          rm -f operator_triggers/mvp_document_fidelity_merge_diagnostic.txt

          mkdir -p output/validation
          {
            echo 'main_merge_completed=true'
            echo "branch_parent=$(git rev-parse HEAD)"
            echo "main_parent=$(git rev-parse origin/main)"
            echo 'resolved_conflicts=CHANGELOG.md,WORKPACKAGES.md'
          } > output/validation/mvp_document_fidelity_main_merge.log

          git add -A
          git diff --cached --check
          git commit -m 'Merge current main into document fidelity hardening'
          git push origin HEAD:scrub-mvp-document-hygiene-fidelity-hardening
