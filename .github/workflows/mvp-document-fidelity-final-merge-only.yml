name: MVP document fidelity final merge only

on:
  push:
    branches:
      - main
    paths:
      - operator_triggers/mvp_document_fidelity_final_merge_only.txt

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-document-hygiene-fidelity-hardening
          fetch-depth: 0

      - name: Merge latest main and push
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'solidprivacy-workpackage-worker'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git merge origin/main --no-edit
          rm -f .github/workflows/mvp-document-fidelity-final-main-sync.yml
          rm -f .github/workflows/mvp-document-fidelity-final-merge-only.yml
          rm -f operator_triggers/mvp_document_fidelity_final_main_sync.txt
          rm -f operator_triggers/mvp_document_fidelity_final_merge_only.txt
          mkdir -p output/validation
          printf 'latest_main_merged=true\nproduct_or_test_change=false\n' > output/validation/mvp_document_fidelity_final_main_merge.log
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:scrub-mvp-document-hygiene-fidelity-hardening
