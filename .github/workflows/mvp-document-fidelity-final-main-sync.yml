name: MVP document fidelity final clean main sync

on:
  push:
    branches:
      - main
    paths:
      - operator_triggers/mvp_document_fidelity_final_main_sync.txt

permissions:
  contents: write

jobs:
  sync-validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-document-hygiene-fidelity-hardening
          fetch-depth: 0

      - name: Merge cleaned main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-workpackage-worker'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git merge origin/main --no-edit
          rm -f .github/workflows/mvp-document-fidelity-final-main-sync.yml
          rm -f operator_triggers/mvp_document_fidelity_final_main_sync.txt
          git add -A
          git commit --amend --no-edit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf streamlit pandas

      - name: Run definitive validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scrub_key_document_reinsert.py \
            mvp_phase6_document_cases.py \
            mvp_document_fidelity_report.py \
            reinsert_mode_ui.py
          python -m pytest -q \
            tests/test_mvp_document_hygiene_fidelity_hardening.py \
            tests/test_mvp_document_fidelity_report.py \
            tests/test_mvp_document_fidelity_ui_copy.py \
            tests/test_mvp_document_fidelity_pr_final_contracts.py \
            tests/test_scrub_key_document_reinsert.py \
            tests/test_mvp_phase6_e2e_synthetic_validation_matrix.py \
            tests/test_mvp_phase6_false_negative_gap_triage.py \
            tests/test_docx_hygiene_audit.py \
            tests/test_hf_space_sync_churn_guard.py | tee /tmp/pytest.log
          git diff --check
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          report_path = Path('output/validation/mvp_document_fidelity_pr_validation.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          report.update({
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'head_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'main_synchronized': True,
              'temporary_tooling_removed_from_main': True,
              'compile_passed': True,
              'pytest_passed': True,
              'diff_check_passed': True,
              'overall_passed': True,
          })
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          Path('output/validation/mvp_document_fidelity_pr_validation.log').write_text(
              'main_synchronized=true\ntemporary_tooling_removed_from_main=true\n'
              + Path('/tmp/pytest.log').read_text(encoding='utf-8')
              + '\ncompile_status=0\npytest_status=0\ndiff_status=0\noverall_status=0\n',
              encoding='utf-8',
          )
          PY

      - name: Commit evidence and push
        shell: bash
        run: |
          set -euo pipefail
          git add output/validation/mvp_document_fidelity_pr_validation.json output/validation/mvp_document_fidelity_pr_validation.log
          git commit -m 'Record definitive document fidelity validation'
          git push origin HEAD:scrub-mvp-document-hygiene-fidelity-hardening
