name: MVP document fidelity main sync

on:
  push:
    branches:
      - main
    paths:
      - operator_triggers/mvp_document_fidelity_main_sync.txt

permissions:
  contents: write

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-document-hygiene-fidelity-hardening
          fetch-depth: 0

      - name: Preserve fidelity governance sections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def save_prefix(path: str, next_marker: str, destination: str) -> None:
              text = Path(path).read_text(encoding='utf-8')
              if not text.startswith('## 2026-07-17'):
                  raise SystemExit(f'Unexpected first section in {path}')
              index = text.find(next_marker)
              if index < 0:
                  raise SystemExit(f'Next section marker missing in {path}')
              Path(destination).write_text(text[:index], encoding='utf-8')

          save_prefix(
              'CHANGELOG.md',
              '## 2026-07-17 — SCRUB-WP_MVP_FALSE_NEGATIVE_GAP_TRIAGE',
              '/tmp/fidelity_changelog_section.md',
          )
          save_prefix(
              'WORKPACKAGES.md',
              '## 2026-07-17 22:08 Europe/Amsterdam — SCRUB-WP_MVP_FALSE_NEGATIVE_GAP_TRIAGE',
              '/tmp/fidelity_workpackages_section.md',
          )
          PY

      - name: Merge current main and resolve only known governance conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-workpackage-worker'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge origin/main --no-commit --no-ff
          merge_status=$?
          set -e

          unresolved=$(git diff --name-only --diff-filter=U | sort)
          expected=$(printf '%s\n' CHANGELOG.md WORKPACKAGES.md | sort)
          if [ "$merge_status" -ne 0 ] && [ "$unresolved" != "$expected" ]; then
            echo 'Unexpected merge conflicts:'
            printf '%s\n' "$unresolved"
            exit 1
          fi

          if [ -n "$unresolved" ]; then
            git checkout --theirs CHANGELOG.md WORKPACKAGES.md
            python - <<'PY'
            from pathlib import Path

            for target, prefix_path, marker in [
                (
                    Path('CHANGELOG.md'),
                    Path('/tmp/fidelity_changelog_section.md'),
                    '## 2026-07-17 — SCRUB-WP_MVP_DOCUMENT_HYGIENE_FIDELITY_HARDENING',
                ),
                (
                    Path('WORKPACKAGES.md'),
                    Path('/tmp/fidelity_workpackages_section.md'),
                    '## 2026-07-17 22:30 Europe/Amsterdam — SCRUB-WP_MVP_DOCUMENT_HYGIENE_FIDELITY_HARDENING',
                ),
            ]:
                current = target.read_text(encoding='utf-8')
                prefix = prefix_path.read_text(encoding='utf-8')
                if marker not in current:
                    target.write_text(prefix + current, encoding='utf-8')
            PY
            git add CHANGELOG.md WORKPACKAGES.md
          fi

          rm -f .github/workflows/mvp-document-fidelity-main-sync.yml
          rm -f .github/workflows/mvp-document-fidelity-merge-diagnostic.yml
          rm -f operator_triggers/mvp_document_fidelity_main_sync.txt
          rm -f operator_triggers/mvp_document_fidelity_merge_diagnostic.txt
          git add -A
          git commit -m 'Merge current main into document fidelity hardening'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf streamlit pandas

      - name: Validate synchronized branch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scrub_key_document_reinsert.py \
            mvp_phase6_document_cases.py \
            mvp_document_fidelity_report.py \
            reinsert_mode_ui.py
          python -m pytest -q \
            tests/test_mvp_document_hygiene_fidelity_hardening.py \
            tests/test_mvp_document_fidelity_report.py \
            tests/test_mvp_document_fidelity_ui_copy.py \
            tests/test_mvp_document_fidelity_pr_final_contracts.py \
            tests/test_scrub_key_document_reinsert.py \
            tests/test_mvp_phase6_e2e_synthetic_validation_matrix.py \
            tests/test_mvp_phase6_false_negative_gap_triage.py \
            tests/test_docx_hygiene_audit.py \
            tests/test_hf_space_sync_churn_guard.py | tee /tmp/pytest.log
          git diff --check
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          report_path = Path('output/validation/mvp_document_fidelity_pr_validation.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          report.update({
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'head_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'main_synchronized': True,
              'compile_passed': True,
              'pytest_passed': True,
              'diff_check_passed': True,
              'overall_passed': True,
          })
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          pytest_log = Path('/tmp/pytest.log').read_text(encoding='utf-8')
          Path('output/validation/mvp_document_fidelity_pr_validation.log').write_text(
              'main_synchronized=true\n' + pytest_log + '\ncompile_status=0\npytest_status=0\ndiff_status=0\noverall_status=0\n',
              encoding='utf-8',
          )
          PY

      - name: Commit validation evidence and push
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'Validate main-synchronized document fidelity hardening'
          git push origin HEAD:scrub-mvp-document-hygiene-fidelity-hardening
