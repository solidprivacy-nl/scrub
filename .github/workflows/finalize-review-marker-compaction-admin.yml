name: Finalize review marker compaction administration

on:
  push:
    branches:
      - wp/review-marker-compaction-live-regression-repair
    paths:
      - .github/workflows/finalize-review-marker-compaction-admin.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp/review-marker-compaction-live-regression-repair
          fetch-depth: 0
      - name: Apply administration
        run: python scripts/finalize_review_marker_compaction_admin.py
      - name: Self-clean and commit
        run: |
          rm scripts/finalize_review_marker_compaction_admin.py
          rm .github/workflows/finalize-review-marker-compaction-admin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(review): finalize marker compaction repair administration"
          git push origin HEAD:wp/review-marker-compaction-live-regression-repair
