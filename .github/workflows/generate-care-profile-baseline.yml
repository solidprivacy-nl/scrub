name: Generate Zorgfilter current-engine baseline

on:
  push:
    branches:
      - scrub-care-profile-current-engine-baseline
    paths:
      - .github/workflows/generate-care-profile-baseline.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrub-care-profile-current-engine-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deterministic baseline dependencies
        run: python -m pip install presidio-analyzer
      - name: Generate current-engine care baseline
        run: python scripts/generate_care_profile_baseline.py
      - name: Remove temporary workflow
        run: rm .github/workflows/generate-care-profile-baseline.yml
      - name: Commit baseline artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/validation/care_profile_v1_current_engine_baseline.json .github/workflows/generate-care-profile-baseline.yml
          git commit -m "Generate current-engine Zorgfilter baseline"
          git push origin HEAD:scrub-care-profile-current-engine-baseline
