name: MVP Scrub Key binding post-merge probe

on:
  push:
    branches:
      - main
    paths:
      - "operator_triggers/mvp_scrub_key_binding_post_merge_probe.txt"

permissions:
  actions: read
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 4a21c2d93acf3c166534a4a0501e602954c5606d
      SPACE_ID: solidprivacy/scrub
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Poll GitHub Actions and Hugging Face runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/validation
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          target = os.environ["TARGET_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          space_id = os.environ["SPACE_ID"]
          token = os.environ["GH_TOKEN"]
          report_path = Path("output/validation/mvp_scrub_key_binding_post_merge_probe.json")

          def get_json(url: str, headers: dict[str, str] | None = None):
              request = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          last = {}
          for attempt in range(1, 31):
              gh_url = (
                  f"https://api.github.com/repos/{repo}/actions/runs"
                  f"?head_sha={target}&per_page=100"
              )
              gh = get_json(
                  gh_url,
                  {
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "solidprivacy-post-merge-probe",
                  },
              )
              runs = [
                  {
                      "id": run.get("id"),
                      "name": run.get("name"),
                      "event": run.get("event"),
                      "status": run.get("status"),
                      "conclusion": run.get("conclusion"),
                      "head_sha": run.get("head_sha"),
                      "html_url": run.get("html_url"),
                  }
                  for run in gh.get("workflow_runs", [])
              ]
              tests = [run for run in runs if run["name"] == "Tests"]
              sync = [run for run in runs if run["name"] == "Sync to Hugging Face Space"]

              try:
                  space = get_json(
                      f"https://huggingface.co/api/spaces/{space_id}",
                      {"User-Agent": "solidprivacy-post-merge-probe"},
                  )
              except Exception as exc:
                  space = {"probe_error": f"{type(exc).__name__}: {exc}"}

              runtime = space.get("runtime") if isinstance(space, dict) else {}
              runtime = runtime if isinstance(runtime, dict) else {}
              hf_sha = space.get("sha") if isinstance(space, dict) else None
              stage = runtime.get("stage")
              tests_ok = any(run.get("conclusion") == "success" for run in tests)
              sync_ok = any(run.get("conclusion") == "success" for run in sync)
              hf_exact = hf_sha == target
              runtime_running = stage == "RUNNING"
              verified = tests_ok and sync_ok and hf_exact and runtime_running

              last = {
                  "workpackage": "SCRUB-WP_MVP_SCRUB_KEY_BINDING_APP_VERIFY",
                  "probe_attempt": attempt,
                  "target_github_sha": target,
                  "github_runs": runs,
                  "tests_success": tests_ok,
                  "sync_success": sync_ok,
                  "hugging_face_space": space_id,
                  "hugging_face_sha": hf_sha,
                  "hugging_face_sha_exact_match": hf_exact,
                  "hugging_face_runtime_stage": stage,
                  "hugging_face_runtime_running": runtime_running,
                  "technical_deployment_verified": verified,
                  "app_verification_required": True,
              }
              report_path.write_text(
                  json.dumps(last, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              if verified:
                  break
              time.sleep(20)

          print(json.dumps(last, ensure_ascii=False, indent=2))
          PY

      - name: Commit probe evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-deployment-probe'
          git config user.email 'actions@users.noreply.github.com'
          git add output/validation/mvp_scrub_key_binding_post_merge_probe.json
          git commit -m 'Record Scrub Key binding post-merge probe'
          git push origin HEAD:main
