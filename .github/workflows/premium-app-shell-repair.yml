name: Premium app shell repair

on:
  push:
    branches:
      - wp/premium-app-shell-implementation
    paths:
      - .github/workflows/premium-app-shell-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp/premium-app-shell-implementation
          fetch-depth: 0
      - name: Repair and syntax-check Streamlit integration
        run: python tools/_repair_premium_app_shell.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): repair premium app-shell integration syntax"
          git push origin HEAD:wp/premium-app-shell-implementation
