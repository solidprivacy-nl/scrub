name: MVP Scrub Key binding reinsert contract fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'scrub-mvp-scrub-key-binding-reinsert-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reinsert branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-scrub-key-binding-reinsert-integration
          fetch-depth: 0
      - name: Apply contract alignment when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/update_binding_model_contract_for_reinsert_integration.py ]]; then
            python scripts/update_binding_model_contract_for_reinsert_integration.py
            rm -f scripts/update_binding_model_contract_for_reinsert_integration.py
          fi
      - name: Commit contract alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-binding-reinsert-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No contract alignment to commit.'
            exit 0
          fi
          git commit -m 'Align binding model contract with reinsert integration'
          git push origin HEAD:scrub-mvp-scrub-key-binding-reinsert-integration
