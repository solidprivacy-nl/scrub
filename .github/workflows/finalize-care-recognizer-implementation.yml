name: Finalize Zorgfilter recognizer implementation

on:
  push:
    branches:
      - scrub-care-profile-recognizer-implementation
    paths:
      - ops/finalize_care_recognizer_implementation.py
      - .github/workflows/finalize-care-recognizer-implementation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrub-care-profile-recognizer-implementation
          fetch-depth: 0
      - run: python ops/finalize_care_recognizer_implementation.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md WORKPACKAGES.md CHANGELOG.md RISK_REGISTER.md workpackage_claims/scrub_wp_care_profile_recognizer_implementation.md ops/finalize_care_recognizer_implementation.py .github/workflows/finalize-care-recognizer-implementation.yml
          git commit -m "Finalize Zorgfilter recognizer implementation"
          git push origin HEAD:scrub-care-profile-recognizer-implementation
