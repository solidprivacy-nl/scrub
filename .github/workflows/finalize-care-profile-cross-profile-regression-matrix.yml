name: Finalize Zorgfilter cross-profile regression matrix

on:
  push:
    branches:
      - scrub-care-profile-cross-profile-regression-matrix
    paths:
      - .github/workflows/finalize-care-profile-cross-profile-regression-matrix.yml
      - ops/finalize_care_profile_cross_profile_regression_matrix.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: scrub-care-profile-cross-profile-regression-matrix
          fetch-depth: 0

      - name: Apply governance finalization
        run: python ops/finalize_care_profile_cross_profile_regression_matrix.py

      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No governance changes to commit"
            exit 1
          fi
          git commit -m "Finalize Zorgfilter cross-profile regression governance"
          git push origin HEAD:scrub-care-profile-cross-profile-regression-matrix
