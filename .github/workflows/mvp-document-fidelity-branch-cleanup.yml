name: MVP document fidelity branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - operator_triggers/mvp_document_fidelity_branch_cleanup.txt

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-document-hygiene-fidelity-hardening
          fetch-depth: 0

      - name: Run cleanup
        run: python scripts/finalize_mvp_document_fidelity_pr_cleanup.py

      - name: Validate and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -f scripts/finalize_mvp_document_fidelity_pr_cleanup.py
          test ! -f scripts/patch_docx_reinsert_capability_copy_only.py
          git config user.name 'solidprivacy-workpackage-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Clean document fidelity PR evidence'
          git push origin HEAD:scrub-mvp-document-hygiene-fidelity-hardening
