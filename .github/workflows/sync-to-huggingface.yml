name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "operator_triggers/**"
      - "workpackage_claims/**"
      - "handover/**"
      - "tests/**"
      - "output/**"
      - "test_cases/**"
      - "PROJECT_PROMPT.md"
      - "PROJECT_PROMPT_SHORT.md"
      - "ROADMAP.md"
      - "WORKPACKAGES.md"
      - "CHANGELOG.md"
      - "DECISION_LOG.md"
      - "RISK_REGISTER.md"
      - "RELEASE_NOTES.md"
      - "STATUS_MONITORING_RUNBOOK.md"
      - "AGENTS.md"
  workflow_dispatch:

concurrency:
  group: sync-to-huggingface
  cancel-in-progress: true

jobs:
  sync-to-huggingface:
    name: Sync GitHub main to Hugging Face Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add huggingface "https://hf:${HF_TOKEN}@huggingface.co/spaces/solidprivacy/scrub"
          git push --force huggingface HEAD:main
