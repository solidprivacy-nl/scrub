name: HF Space runtime probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - operator_triggers/hf_space_runtime_probe.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: solidprivacy/scrub
      EVIDENCE_BRANCH: hf-space-runtime-probe-evidence-20260717
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client
        run: python -m pip install --upgrade 'huggingface_hub>=1.1,<2'

      - name: Probe Space runtime and logs
        id: probe
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p output/incidents/hf_space_probe_20260717
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import signal
          from datetime import datetime, timezone
          from pathlib import Path

          from huggingface_hub import HfApi

          out = Path('output/incidents/hf_space_probe_20260717')
          out.mkdir(parents=True, exist_ok=True)
          token = os.environ['HF_TOKEN']
          repo_id = os.environ['HF_SPACE_ID']
          api = HfApi(token=token)
          secret_pattern = re.compile(r'hf_[A-Za-z0-9]{8,}')

          def sanitize(value: str) -> str:
              return secret_pattern.sub('hf_[REDACTED]', value)

          class TimedOut(Exception):
              pass

          def alarm_handler(signum, frame):
              raise TimedOut('operation timed out')

          signal.signal(signal.SIGALRM, alarm_handler)

          report = {
              'schema': 'solidprivacy.hf_space_runtime_probe',
              'schema_version': '1.0',
              'space_id': repo_id,
              'captured_at': datetime.now(timezone.utc).isoformat(),
              'secrets_recorded': False,
          }

          try:
              signal.alarm(45)
              runtime = api.get_space_runtime(repo_id=repo_id)
              signal.alarm(0)
              report['runtime'] = {
                  'stage': runtime.stage,
                  'hardware': runtime.hardware,
                  'requested_hardware': runtime.requested_hardware,
                  'sleep_time': runtime.sleep_time,
              }
          except Exception as exc:
              signal.alarm(0)
              report['runtime_error'] = sanitize(f'{type(exc).__name__}: {exc}')

          for build, name in [(True, 'build.log'), (False, 'run.log')]:
              try:
                  signal.alarm(60)
                  lines = list(api.fetch_space_logs(repo_id=repo_id, build=build, follow=False))
                  signal.alarm(0)
                  text = sanitize(''.join(lines))
                  (out / name).write_text(text[-100000:], encoding='utf-8')
                  report[name] = {'ok': True, 'line_count': len(lines)}
              except Exception as exc:
                  signal.alarm(0)
                  message = sanitize(f'{type(exc).__name__}: {exc}')
                  (out / name).write_text(message + '\n', encoding='utf-8')
                  report[name] = {'ok': False, 'error': message}

          try:
              signal.alarm(45)
              info = api.space_info(repo_id=repo_id)
              signal.alarm(0)
              report['space_sha'] = getattr(info, 'sha', None)
              report['subdomain'] = getattr(info, 'subdomain', None)
          except Exception as exc:
              signal.alarm(0)
              report['space_info_error'] = sanitize(f'{type(exc).__name__}: {exc}')

          (out / 'report.json').write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Ensure failure evidence exists
        if: always()
        run: |
          mkdir -p output/incidents/hf_space_probe_20260717
          if [ ! -f output/incidents/hf_space_probe_20260717/report.json ]; then
            printf '{"schema":"solidprivacy.hf_space_runtime_probe","probe_step_outcome":"%s","report_generation_failed":true}\n' '${{ steps.probe.outcome }}' > output/incidents/hf_space_probe_20260717/report.json
          fi

      - name: Publish probe evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-incident-worker'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B "$EVIDENCE_BRANCH"
          git add output/incidents/hf_space_probe_20260717
          git commit -m 'Record HF Space runtime probe evidence' || true
          git push --force origin HEAD:"$EVIDENCE_BRANCH"
