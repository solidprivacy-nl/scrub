name: Premium staged workspace roadmap scope cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup-roadmap:
    if: github.head_ref == 'wp/premium-staged-workspace-decision'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Restore unrelated roadmap status text and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('ROADMAP.md')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
              'SCRUB-WP_MVP_SCRUB_KEY_BINDING_REINSERT_INTEGRATION — implemented with dual-read import, fail-closed binding enforcement and explicit legacy compatibility.\n',
              'SCRUB-WP_MVP_SCRUB_KEY_BINDING_REINSERT_INTEGRATION — implemented with dual-read import, fail-closed binding enforcement and explicit legacy compatibility; app verification pending.\n',
          )

          old = (
              'GitHub-to-Hugging-Face synchronization is independently verified for merge commit '
              '`cca4a25aaff28a7ba647c961d8e50f0e076921e2`: twelve relevant source files match byte-for-byte, '
              'all correctly scoped Zorg markers are present, the Streamlit health endpoint returns `200 / ok` and the Space root '
              'returns HTTP 200. The initial sync check produced a false negative because two marker groups were assigned to the wrong '
              'modules; the hashes were already equal and the corrected verification passed.'
          )
          restored = (
              'GitHub-to-Hugging-Face synchronization is now independently verified for merge commit '
              '`cca4a25aaff28a7ba647c961d8e50f0e076921e2`: twelve relevant source files match byte-for-byte, '
              'all correctly scoped Zorg markers are present, the Streamlit health endpoint returns `200 / ok` and the Space root '
              'returns HTTP 200. The initial sync check produced a false negative because two marker groups were assigned to the wrong '
              'modules; the hashes were already equal and the corrected verification passed. The remaining gate is coordinator/user '
              'confirmation of the visible app behavior and generic-NER observation.'
          )
          if old in text:
              text = text.replace(old, restored)

          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/premium-staged-workspace-roadmap-scope-cleanup.yml').unlink()
          PY

      - name: Commit scope cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(ui): keep staged workspace roadmap diff in scope"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
