name: HF Space incident closeout PR finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'scrub-hf-space-incident-closeout'
    runs-on: ubuntu-latest
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4
        with:
          ref: scrub-hf-space-incident-closeout
          fetch-depth: 0

      - name: Finalize central records
        run: python scripts/finalize_hf_space_incident_closeout.py

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'Hugging Face Space runtime incident recovery and sync-churn guard' CHANGELOG.md
          grep -q 'HF Space runtime incident closeout' WORKPACKAGES.md
          test ! -f scripts/finalize_hf_space_incident_closeout.py
          git config user.name 'solidprivacy-incident-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize HF Space incident records'
          git push origin HEAD:scrub-hf-space-incident-closeout
