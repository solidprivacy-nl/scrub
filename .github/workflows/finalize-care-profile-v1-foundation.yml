name: Finalize Zorgfilter v1 foundation

on:
  push:
    branches:
      - scrub-care-profile-v1-foundation
    paths:
      - ops/finalize_care_profile_v1_foundation.py
      - .github/workflows/finalize-care-profile-v1-foundation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrub-care-profile-v1-foundation
          fetch-depth: 0
      - run: python ops/finalize_care_profile_v1_foundation.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WORKPACKAGES.md CHANGELOG.md workpackage_claims/scrub_wp_care_profile_v1_policy_and_corpus_foundation.md handover/workpackages/20260803_1531_care_profile_v1_policy_and_corpus_foundation.md ops/finalize_care_profile_v1_foundation.py .github/workflows/finalize-care-profile-v1-foundation.yml
          git commit -m "Finalize Zorgfilter v1 foundation"
          git push origin HEAD:scrub-care-profile-v1-foundation
