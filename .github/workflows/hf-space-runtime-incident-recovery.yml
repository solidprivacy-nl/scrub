name: HF Space runtime incident recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - operator_triggers/hf_space_runtime_incident_recovery.txt

permissions:
  contents: write

concurrency:
  group: hf-space-runtime-incident-recovery
  cancel-in-progress: false

jobs:
  diagnose-and-recover:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: solidprivacy/scrub
      EVIDENCE_BRANCH: hf-space-runtime-incident-evidence-20260717
    steps:
      - name: Check out GitHub source of truth
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face runtime client
        run: python -m pip install --upgrade 'huggingface_hub>=1.1,<2'

      - name: Diagnose and recover Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          from huggingface_hub import HfApi

          repo_id = os.environ['HF_SPACE_ID']
          token = os.environ['HF_TOKEN']
          api = HfApi(token=token)
          out = Path('output/incidents/hf_space_runtime_20260717')
          out.mkdir(parents=True, exist_ok=True)

          secret_pattern = re.compile(r'hf_[A-Za-z0-9]{8,}')

          def sanitize(value: str) -> str:
              value = secret_pattern.sub('hf_[REDACTED]', value)
              value = re.sub(r'(?i)(authorization\s*[:=]\s*)(\S+)', r'\1[REDACTED]', value)
              return value

          def runtime_snapshot(label: str) -> dict:
              runtime = api.get_space_runtime(repo_id=repo_id)
              snapshot = {
                  'label': label,
                  'captured_at': datetime.now(timezone.utc).isoformat(),
                  'stage': runtime.stage,
                  'hardware': runtime.hardware,
                  'requested_hardware': runtime.requested_hardware,
                  'sleep_time': runtime.sleep_time,
              }
              return snapshot

          def fetch_logs(build: bool, filename: str) -> dict:
              path = out / filename
              try:
                  lines = list(api.fetch_space_logs(repo_id=repo_id, build=build, follow=False))
                  text = sanitize(''.join(lines))
                  path.write_text(text[-120000:], encoding='utf-8')
                  return {'ok': True, 'line_count': len(lines), 'path': str(path)}
              except Exception as exc:
                  path.write_text(sanitize(f'{type(exc).__name__}: {exc}\n'), encoding='utf-8')
                  return {'ok': False, 'error': sanitize(f'{type(exc).__name__}: {exc}'), 'path': str(path)}

          def poll_until_settled(prefix: str, timeout_seconds: int) -> list[dict]:
              observations = []
              deadline = time.time() + timeout_seconds
              intermediate = {'BUILDING', 'RUNNING_BUILDING', 'APP_STARTING', 'RUNNING_APP_STARTING'}
              while time.time() < deadline:
                  snap = runtime_snapshot(prefix)
                  observations.append(snap)
                  if snap['stage'] not in intermediate:
                      break
                  time.sleep(10)
              return observations

          report = {
              'schema': 'solidprivacy.hf_space_runtime_incident_recovery',
              'schema_version': '1.0',
              'space_id': repo_id,
              'started_at': datetime.now(timezone.utc).isoformat(),
              'actions': [],
              'observations': [],
              'secrets_recorded': False,
              'product_code_changed': False,
          }

          before = runtime_snapshot('before_recovery')
          report['observations'].append(before)
          report['before_build_logs'] = fetch_logs(True, 'build_before.log')
          report['before_run_logs'] = fetch_logs(False, 'run_before.log')

          if before['stage'] != 'RUNNING':
              api.restart_space(repo_id=repo_id, factory_reboot=False)
              report['actions'].append('normal_restart')
              report['observations'].extend(poll_until_settled('after_normal_restart', 240))

          current = runtime_snapshot('after_normal_restart_settled')
          report['observations'].append(current)

          if current['stage'] != 'RUNNING':
              api.restart_space(repo_id=repo_id, factory_reboot=True)
              report['actions'].append('factory_reboot')
              report['observations'].extend(poll_until_settled('after_factory_reboot', 900))

          final = runtime_snapshot('final')
          report['observations'].append(final)
          report['final_stage'] = final['stage']
          report['recovered'] = final['stage'] == 'RUNNING'
          report['after_build_logs'] = fetch_logs(True, 'build_after.log')
          report['after_run_logs'] = fetch_logs(False, 'run_after.log')

          try:
              info = api.space_info(repo_id=repo_id)
              subdomain = getattr(info, 'subdomain', None)
              report['space_sha'] = getattr(info, 'sha', None)
              report['subdomain'] = subdomain
              if subdomain:
                  url = f'https://{subdomain}.hf.space/'
                  request = urllib.request.Request(url, headers={'User-Agent': 'SolidPrivacy-incident-check/1.0'})
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          report['http_probe'] = {'url': url, 'status': response.status, 'ok': 200 <= response.status < 400}
                  except urllib.error.HTTPError as exc:
                      report['http_probe'] = {'url': url, 'status': exc.code, 'ok': False}
                  except Exception as exc:
                      report['http_probe'] = {'url': url, 'status': None, 'ok': False, 'error': sanitize(f'{type(exc).__name__}: {exc}')}
          except Exception as exc:
              report['space_info_error'] = sanitize(f'{type(exc).__name__}: {exc}')

          report['finished_at'] = datetime.now(timezone.utc).isoformat()
          (out / 'report.json').write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps({
              'before_stage': before['stage'],
              'actions': report['actions'],
              'final_stage': report['final_stage'],
              'recovered': report['recovered'],
              'http_probe': report.get('http_probe'),
          }, indent=2))
          PY

      - name: Publish incident evidence to dedicated branch
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-incident-worker'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B "$EVIDENCE_BRANCH"
          git add output/incidents/hf_space_runtime_20260717
          git commit -m 'Record HF Space runtime incident evidence' || true
          git push --force origin HEAD:"$EVIDENCE_BRANCH"
