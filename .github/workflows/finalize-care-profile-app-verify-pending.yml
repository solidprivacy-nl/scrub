name: Finalize pending Zorgfilter app verification

on:
  push:
    branches:
      - scrub-care-profile-app-verify
    paths:
      - .github/workflows/finalize-care-profile-app-verify-pending.yml
      - ops/finalize_care_profile_app_verify_pending.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: scrub-care-profile-app-verify
          fetch-depth: 0

      - name: Apply pending verification governance
        run: python ops/finalize_care_profile_app_verify_pending.py

      - name: Commit governance and self-cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No governance changes to commit"
            exit 1
          fi
          git commit -m "Record pending Zorgfilter app verification status"
          git push origin HEAD:scrub-care-profile-app-verify
