name: Fix care corpus clinical marker

on:
  push:
    branches:
      - scrub-care-profile-v1-foundation
    paths:
      - ops/fix_care_corpus_clinical_marker.py
      - .github/workflows/fix-care-corpus-clinical-marker.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrub-care-profile-v1-foundation
          fetch-depth: 0
      - run: python ops/fix_care_corpus_clinical_marker.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add care_test_examples.py ops/fix_care_corpus_clinical_marker.py .github/workflows/fix-care-corpus-clinical-marker.yml
          git commit -m "Fix care corpus clinical marker"
          git push origin HEAD:scrub-care-profile-v1-foundation
