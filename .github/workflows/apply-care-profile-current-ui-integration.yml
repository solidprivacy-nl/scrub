name: Apply Zorgfilter current UI integration

on:
  push:
    branches:
      - scrub-care-profile-current-ui-integration
    paths:
      - ops/run_care_profile_current_ui_integration.py
      - .github/workflows/apply-care-profile-current-ui-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: scrub-care-profile-current-ui-integration
          fetch-depth: 0

      - name: Apply targeted integration
        run: python ops/run_care_profile_current_ui_integration.py

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            presidio_helpers.py \
            presidio_streamlit.py \
            document_tools.py \
            ui_texts_nl.py \
            display_labels_nl.py \
            profile_ui_support.py \
            care_candidate_scanner.py

      - name: Commit integration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 1
          fi
          git commit -m "Integrate Zorgfilter into current Streamlit profile flow"
          git push origin HEAD:scrub-care-profile-current-ui-integration
