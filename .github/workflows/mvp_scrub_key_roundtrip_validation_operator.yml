name: MVP Scrub Key roundtrip validation operator

on:
  push:
    branches:
      - scrub-mvp-scrub-key-roundtrip-validation

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Record MVP Scrub Key roundtrip validation report'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-scrub-key-roundtrip-validation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run targeted validation
        run: |
          python -m py_compile mvp_scrub_key_roundtrip_validation.py scripts/run_mvp_scrub_key_roundtrip_validation.py
          python -m pytest -q tests/test_mvp_scrub_key_roundtrip_validation.py tests/test_scrub_key_secure_import_export.py
          python scripts/run_mvp_scrub_key_roundtrip_validation.py

      - name: Commit machine-readable report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-roundtrip-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add output/validation/mvp_scrub_key_roundtrip_validation_report.json
          git commit -m 'Record MVP Scrub Key roundtrip validation report'
          git push origin HEAD:scrub-mvp-scrub-key-roundtrip-validation
