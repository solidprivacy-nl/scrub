name: PR37 post-merge verification

on:
  push:
    branches:
      - main
    paths:
      - operator_triggers/pr37_postmerge_verification.txt

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      EXPECTED_RUNTIME_SHA: b2ee32b2b6ca2a088213239c05c7ee7a17177741
      EVIDENCE_BRANCH: evidence/pr37-postmerge-verification
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect sanitized GitHub and Hugging Face evidence
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/validation

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_RUNTIME_SHA}&per_page=50" \
            > /tmp/github_runs.json

          tests_conclusion=$(jq -r '[.workflow_runs[] | select(.name == "Tests")][0].conclusion // "missing"' /tmp/github_runs.json)
          sync_conclusion=$(jq -r '[.workflow_runs[] | select(.name == "Sync to Hugging Face Space")][0].conclusion // "missing"' /tmp/github_runs.json)
          tests_run_id=$(jq -r '[.workflow_runs[] | select(.name == "Tests")][0].id // 0' /tmp/github_runs.json)
          sync_run_id=$(jq -r '[.workflow_runs[] | select(.name == "Sync to Hugging Face Space")][0].id // 0' /tmp/github_runs.json)

          hf_remote_sha=$(git ls-remote \
            "https://hf:${HF_TOKEN}@huggingface.co/spaces/solidprivacy/scrub" \
            refs/heads/main | awk '{print $1}')

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/api/spaces/solidprivacy/scrub" \
            > /tmp/hf_space.json
          hf_api_sha=$(jq -r '.sha // "missing"' /tmp/hf_space.json)
          hf_stage=$(jq -r '.runtime.stage // "missing"' /tmp/hf_space.json)
          hf_hardware=$(jq -r '.runtime.hardware.current // .runtime.hardware.requested // "missing"' /tmp/hf_space.json)

          overall_passed=false
          if [ "${tests_conclusion}" = "success" ] \
             && [ "${sync_conclusion}" = "success" ] \
             && [ "${hf_remote_sha}" = "${EXPECTED_RUNTIME_SHA}" ] \
             && [ "${hf_stage}" = "RUNNING" ]; then
            overall_passed=true
          fi

          jq -n \
            --arg schema "solidprivacy.pr37_postmerge_verification" \
            --arg schema_version "1.0" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg expected_runtime_sha "${EXPECTED_RUNTIME_SHA}" \
            --arg tests_conclusion "${tests_conclusion}" \
            --arg sync_conclusion "${sync_conclusion}" \
            --argjson tests_run_id "${tests_run_id}" \
            --argjson sync_run_id "${sync_run_id}" \
            --arg hf_remote_sha "${hf_remote_sha}" \
            --arg hf_api_sha "${hf_api_sha}" \
            --arg hf_stage "${hf_stage}" \
            --arg hf_hardware "${hf_hardware}" \
            --argjson overall_passed "${overall_passed}" \
            '{
              schema: $schema,
              schema_version: $schema_version,
              generated_at: $generated_at,
              expected_runtime_sha: $expected_runtime_sha,
              github_actions: {
                tests: {run_id: $tests_run_id, conclusion: $tests_conclusion},
                hugging_face_sync: {run_id: $sync_run_id, conclusion: $sync_conclusion}
              },
              hugging_face: {
                remote_main_sha: $hf_remote_sha,
                api_sha: $hf_api_sha,
                runtime_stage: $hf_stage,
                hardware: $hf_hardware
              },
              synthetic_data_only: true,
              secrets_recorded: false,
              app_functional_verification_required: true,
              overall_passed: $overall_passed
            }' > output/validation/pr37_postmerge_verification.json

          git config user.name 'solidprivacy-verification-worker'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B "${EVIDENCE_BRANCH}" origin/main
          git add output/validation/pr37_postmerge_verification.json
          git commit -m 'Record PR37 post-merge verification evidence'
          git push --force origin "HEAD:${EVIDENCE_BRANCH}"

          if [ "${overall_passed}" != "true" ]; then
            exit 1
          fi
