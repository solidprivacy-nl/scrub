name: MVP Scrub Key roundtrip finalizer

on:
  push:
    branches:
      - scrub-mvp-scrub-key-roundtrip-validation

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize MVP Scrub Key roundtrip validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-scrub-key-roundtrip-validation
          fetch-depth: 0

      - name: Apply governance finalisation
        run: python scripts/finalize_mvp_scrub_key_roundtrip_validation.py

      - name: Remove one-time finalizer and generated cache
        shell: bash
        run: |
          rm -f scripts/finalize_mvp_scrub_key_roundtrip_validation.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit finalised validation package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-roundtrip-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize MVP Scrub Key roundtrip validation'
          git push origin HEAD:scrub-mvp-scrub-key-roundtrip-validation
