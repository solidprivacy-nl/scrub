name: MVP Scrub Key binding contract PR diagnostic

on:
  push:
    branches:
      - scrub-mvp-scrub-key-binding-contract-tests

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'Record Scrub Key binding contract PR diagnostic'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-scrub-key-binding-contract-tests
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf streamlit pandas

      - name: Capture first regression failure
        shell: bash
        run: |
          set +e
          mkdir -p output/validation
          python -m pytest -q -x tests > output/validation/mvp_scrub_key_binding_contract_pr_diagnostic.log 2>&1
          status=$?
          echo "pytest_status=${status}" >> output/validation/mvp_scrub_key_binding_contract_pr_diagnostic.log
          exit 0

      - name: Record diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-binding-contract-diagnostic'
          git config user.email 'actions@users.noreply.github.com'
          git add output/validation/mvp_scrub_key_binding_contract_pr_diagnostic.log
          git commit -m 'Record Scrub Key binding contract PR diagnostic'
          git push origin HEAD:scrub-mvp-scrub-key-binding-contract-tests
