name: Issue70 admin closeout patcher

on:
  push:
    branches:
      - wp/issue70-post-merge-actions-evidence-recovery
    paths:
      - operator_triggers/issue70_admin_closeout.txt

permissions:
  contents: write

jobs:
  patch-central-records:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: wp/issue70-post-merge-actions-evidence-recovery
          fetch-depth: 0

      - name: Add central candidate-status records
        shell: bash
        env:
          WORKPACKAGES_ENTRY_B64: 
          CHANGELOG_ENTRY_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          marker = "SCRUB-WP_ISSUE70_POST_MERGE_ACTIONS_EVIDENCE_RECOVERY — repaired candidate"
          entries = {
              "WORKPACKAGES.md": base64.b64decode(os.environ["WORKPACKAGES_ENTRY_B64"]).decode("utf-8"),
              "CHANGELOG.md": base64.b64decode(os.environ["CHANGELOG_ENTRY_B64"]).decode("utf-8"),
          }
          for filename, entry in entries.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              already = marker in text if filename == "WORKPACKAGES.md" else "Issue #70 Actions evidence recovery repair" in text
              if not already:
                  path.write_text(entry.rstrip() + "\n\n" + text, encoding="utf-8")
          PY

          git config user.name 'solidprivacy-control-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add WORKPACKAGES.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'Central records already contain the repaired candidate status.'
            exit 0
          fi
          git commit -m 'docs(governance): record issue70 repaired candidate centrally'
          git push origin HEAD:wp/issue70-post-merge-actions-evidence-recovery
