name: Repair Premium presentation state

on:
  push:
    branches:
      - wp/premium-app-shell-implementation
    paths:
      - .github/workflows/repair-premium-presentation-state.yml
      - tools/repair_premium_presentation_state.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp/premium-app-shell-implementation
          fetch-depth: 0
      - name: Apply repair and syntax check
        run: python tools/repair_premium_presentation_state.py
      - name: Self-clean and commit repair
        run: |
          rm .github/workflows/repair-premium-presentation-state.yml
          rm tools/repair_premium_presentation_state.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presidio_streamlit.py .github/workflows/repair-premium-presentation-state.yml tools/repair_premium_presentation_state.py
          git commit -m "fix(ui): hydrate processing state across Standard and Expert"
          git push origin HEAD:wp/premium-app-shell-implementation
