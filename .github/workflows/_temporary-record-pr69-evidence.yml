name: Temporary PR69 evidence update

on:
  push:
    branches:
      - wp/processed-text-selection-cross-flow-regression
    paths:
      - tools/_temporary_record_pr69_evidence.py
      - .github/workflows/_temporary-record-pr69-evidence.yml

permissions:
  contents: write

jobs:
  update-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: wp/processed-text-selection-cross-flow-regression
          fetch-depth: 0

      - name: Record exact machine evidence
        run: python tools/_temporary_record_pr69_evidence.py

      - name: Commit evidence update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No evidence updates required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WORKPACKAGES.md CHANGELOG.md
          git commit -m "Record PR69 machine validation evidence [skip ci]"
          git push origin HEAD:wp/processed-text-selection-cross-flow-regression
