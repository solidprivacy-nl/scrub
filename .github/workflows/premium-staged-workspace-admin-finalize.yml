name: Premium staged workspace admin finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-admin:
    if: github.head_ref == 'wp/premium-staged-workspace-decision'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Prepend authoritative records and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          records = [
              (
                  "WORKPACKAGES.md",
                  ".admin/premium_staged_workspace_workpackages_prefix.md",
                  "SCRUB-WP_PREMIUM_STAGED_WORKSPACE_DECISION_FREEZE — urgent architecture gate",
              ),
              (
                  "CHANGELOG.md",
                  ".admin/premium_staged_workspace_changelog_prefix.md",
                  "SCRUB-WP_PREMIUM_STAGED_WORKSPACE_DECISION_FREEZE — staged workspace architecture candidate",
              ),
              (
                  "DECISION_LOG.md",
                  ".admin/premium_staged_workspace_decision_prefix.md",
                  "D043 — Freeze Premium Standard as a single-page staged document workspace",
              ),
          ]

          for target_name, prefix_name, marker in records:
              target = Path(target_name)
              current = target.read_text(encoding="utf-8")
              if marker not in current:
                  prefix = Path(prefix_name).read_text(encoding="utf-8")
                  target.write_text(prefix + current, encoding="utf-8")

          for path in [
              ".admin/premium_staged_workspace_workpackages_prefix.md",
              ".admin/premium_staged_workspace_changelog_prefix.md",
              ".admin/premium_staged_workspace_decision_prefix.md",
              ".github/workflows/premium-staged-workspace-admin-finalize.yml",
          ]:
              Path(path).unlink(missing_ok=True)
          PY

      - name: Commit administrative finalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(ui): bind staged workspace execution queue"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
