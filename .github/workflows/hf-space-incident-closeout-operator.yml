name: HF Space incident closeout operator

on:
  push:
    branches:
      - main
    paths:
      - operator_triggers/hf_space_incident_closeout.txt

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4
        with:
          ref: scrub-hf-space-incident-closeout
          fetch-depth: 0

      - name: Finalize incident records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          completed_at = "2026-07-17 11:45 Europe/Amsterdam"

          def replace_status(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new not in text:
                  if old not in text:
                      raise SystemExit(f"Expected status not found in {path}")
                  text = text.replace(old, new, 1)
              file.write_text(text, encoding="utf-8")

          incident_claim = Path("workpackage_claims/scrub_wp_hf_space_runtime_incident_recovery.md")
          replace_status(str(incident_claim), "Status: in_progress", "Status: completed and app-verified")
          text = incident_claim.read_text(encoding="utf-8")
          if "Recovery result:" not in text:
              text += f'''\n\nRecovery result:\n- Completed at: {completed_at}\n- Sanitized runtime probe observed the Space at stage `RUNNING`.\n- Streamlit started on port 7860 and the Flair model loaded.\n- Coordinator confirmed that the application opens again.\n- No product rollback or product-code change was required.\n- Temporary recovery/probe workflows and triggers are removed by the closeout package.\n- Handover: `handover/workpackages/20260717_1145_hf_space_runtime_incident_recovery.md`\n'''
          incident_claim.write_text(text, encoding="utf-8")

          sync_claim = Path("workpackage_claims/scrub_wp_hf_space_sync_churn_guard.md")
          replace_status(str(sync_claim), "Status: in_progress", "Status: completed and verified")
          text = sync_claim.read_text(encoding="utf-8")
          if "Guard result:" not in text:
              text += f'''\n\nGuard result:\n- Completed at: {completed_at}\n- PR #35 merged the conservative non-runtime `paths-ignore` deployment guard.\n- Runtime-critical files remain deployment-triggering.\n- A post-guard probe observed the Space at stage `RUNNING`.\n- Coordinator confirmed that the application opens again.\n- Handover: `handover/workpackages/20260717_1145_hf_space_sync_churn_guard.md`\n'''
          sync_claim.write_text(text, encoding="utf-8")

          closeout_claim = Path("workpackage_claims/scrub_wp_hf_space_incident_closeout.md")
          replace_status(str(closeout_claim), "Status: in_progress", "Status: completed")
          text = closeout_claim.read_text(encoding="utf-8")
          if "Closeout result:" not in text:
              text += f'''\n\nCloseout result:\n- Completed at: {completed_at}\n- Live application recovery confirmed by the coordinator.\n- Temporary recovery and probe workflows/triggers removed.\n- Permanent sync-churn guard retained.\n- No product code, UI, recognizer, replacement, export, Scrub Key or reinsert behavior changed.\n- Handover: `handover/workpackages/20260717_1145_hf_space_incident_closeout.md`\n- Next step: resume PR #33 document-fidelity validation.\n'''
          closeout_claim.write_text(text, encoding="utf-8")

          handovers = {
              "handover/workpackages/20260717_1145_hf_space_runtime_incident_recovery.md": '''# Handover — SCRUB-WP_HF_SPACE_RUNTIME_INCIDENT_RECOVERY

Repository worked in: solidprivacy-nl/scrub

## Workpackage title

SCRUB-WP_HF_SPACE_RUNTIME_INCIDENT_RECOVERY

## Status

Completed and app-verified.

## Files added

- `workpackage_claims/scrub_wp_hf_space_runtime_incident_recovery.md`

## Files changed

- No product files changed.

## Tests

- Sanitized Hugging Face runtime and log probes.
- Runtime-stage verification.
- Coordinator live application verification.

## Validation status

- Runtime stage: `RUNNING`.
- Streamlit startup visible in the sanitized run log.
- Flair model load visible in the sanitized run log.
- Coordinator confirmed that the application opens again.

## GitHub Actions status

Temporary recovery/probe workflows executed; no product test regression was introduced.

## Hugging Face sync status

Recovered and running.

## App verification status

Passed at 2026-07-17 11:44 Europe/Amsterdam.

## Remaining risks

- Long Docker/model rebuilds can temporarily present as an unavailable Space.
- Deployment churn from non-runtime commits required a separate permanent guard.

## Next recommended step

Close the incident tooling and retain the sync-churn guard.
''',
              "handover/workpackages/20260717_1145_hf_space_sync_churn_guard.md": '''# Handover — SCRUB-WP_HF_SPACE_SYNC_CHURN_GUARD

Repository worked in: solidprivacy-nl/scrub

## Workpackage title

SCRUB-WP_HF_SPACE_SYNC_CHURN_GUARD

## Status

Completed and verified.

## Files added

- `tests/test_hf_space_sync_churn_guard.py`
- `workpackage_claims/scrub_wp_hf_space_sync_churn_guard.md`

## Files changed

- `.github/workflows/sync-to-huggingface.yml`

## Tests

- Source-level contracts verify non-runtime ignore paths.
- Contracts verify runtime-critical files are not ignored.
- Existing force-push and manual-dispatch deployment behavior remains present.

## Validation status

The guard is merged. A post-guard runtime probe observed `RUNNING`, and the coordinator confirmed that the app opens.

## GitHub Actions status

PR #35 merged successfully.

## Hugging Face sync status

Running; unnecessary deployments from clearly non-runtime-only commits are now suppressed.

## App verification status

Passed at 2026-07-17 11:44 Europe/Amsterdam.

## Remaining risks

- Any commit that includes a runtime-relevant file still correctly rebuilds the Space.
- Hugging Face infrastructure or dependency-download failures remain external risks.

## Next recommended step

Resume the Phase 6 document-fidelity package.
''',
              "handover/workpackages/20260717_1145_hf_space_incident_closeout.md": '''# Handover — SCRUB-WP_HF_SPACE_INCIDENT_CLOSEOUT

Repository worked in: solidprivacy-nl/scrub

## Workpackage title

SCRUB-WP_HF_SPACE_INCIDENT_CLOSEOUT

## Status

Completed.

## Files added

- `workpackage_claims/scrub_wp_hf_space_incident_closeout.md`
- `handover/workpackages/20260717_1145_hf_space_runtime_incident_recovery.md`
- `handover/workpackages/20260717_1145_hf_space_sync_churn_guard.md`
- `handover/workpackages/20260717_1145_hf_space_incident_closeout.md`

## Files removed

- `.github/workflows/hf-space-runtime-incident-recovery.yml`
- `.github/workflows/hf-space-runtime-probe.yml`
- `operator_triggers/hf_space_runtime_incident_recovery.txt`
- `operator_triggers/hf_space_runtime_probe.txt`

## Files changed

- `CHANGELOG.md`
- `WORKPACKAGES.md`
- incident and sync-guard claims.

## Tests

No product test changes. Recovery was verified through sanitized runtime/log probes and coordinator app verification.

## Validation status

Passed.

## GitHub Actions status

Incident workflows completed sufficiently to establish `RUNNING`; temporary workflows are removed.

## Hugging Face sync status

Recovered and stable after deployment-churn guard.

## App verification status

Passed at 2026-07-17 11:44 Europe/Amsterdam.

## Remaining risks

- The Space remains a hosted prototype with external build/runtime dependencies.
- Product-runtime changes still require normal Actions, sync and app verification.

## Next recommended step

Resume PR #33 and the Phase 6 document-hygiene/fidelity sequence.
''',
          }
          for path, content in handovers.items():
              file = Path(path)
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content, encoding="utf-8")

          changelog_entry = '''## 2026-07-17 — Hugging Face Space runtime incident recovery and sync-churn guard

Status: completed and app-verified.

Purpose:

- Restore the Hugging Face Space after it entered an error/rebuild state.
- Diagnose the incident without exposing secrets or changing product behavior.
- Prevent clearly non-runtime-only commits from repeatedly rebuilding the live Space.

Result:

- Sanitized runtime evidence observed the Space first at `BUILDING` and subsequently at `RUNNING`.
- Streamlit started on port 7860 and the Flair model loaded.
- The coordinator confirmed that the application opens again.
- PR #35 added a conservative deployment `paths-ignore` guard while preserving all runtime-relevant deployments and manual dispatch.
- Temporary incident recovery/probe workflows and triggers were removed after verification.

Intentionally not changed:

- product code or UI;
- recognizers, thresholds or replacement semantics;
- export, Scrub Key or reinsert semantics;
- dependencies, Dockerfile, hardware or Hugging Face configuration;
- privacy and human-review controls.

Next recommended step:

- Resume PR #33 and the Phase 6 document-fidelity sequence.

---

'''
          changelog = Path("CHANGELOG.md")
          current = changelog.read_text(encoding="utf-8")
          marker = "## 2026-07-17 — Hugging Face Space runtime incident recovery and sync-churn guard"
          if marker not in current:
              changelog.write_text(changelog_entry + current, encoding="utf-8")

          workpackages_entry = '''## 2026-07-17 11:45 Europe/Amsterdam — HF Space runtime incident closeout

Status: completed and app-verified.

Summary:
- Restored the Hugging Face Space and confirmed runtime stage `RUNNING`.
- Coordinator confirmed that the application opens again.
- Merged a conservative sync-churn guard so clearly non-runtime-only commits no longer rebuild the Space.
- Removed temporary recovery and probe workflows/triggers.
- No product behavior or privacy controls changed.

Active next package:
- Resume `SCRUB-WP_MVP_DOCUMENT_HYGIENE_FIDELITY_HARDENING` in PR #33.

'''
          workpackages = Path("WORKPACKAGES.md")
          current = workpackages.read_text(encoding="utf-8")
          marker = "## 2026-07-17 11:45 Europe/Amsterdam — HF Space runtime incident closeout"
          if marker not in current:
              workpackages.write_text(workpackages_entry + current, encoding="utf-8")
          PY

      - name: Validate and commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path

          assert not Path('.github/workflows/hf-space-runtime-incident-recovery.yml').exists()
          assert not Path('.github/workflows/hf-space-runtime-probe.yml').exists()
          assert not Path('operator_triggers/hf_space_runtime_incident_recovery.txt').exists()
          assert not Path('operator_triggers/hf_space_runtime_probe.txt').exists()
          assert 'Status: completed and app-verified' in Path('workpackage_claims/scrub_wp_hf_space_runtime_incident_recovery.md').read_text(encoding='utf-8')
          assert 'Status: completed and verified' in Path('workpackage_claims/scrub_wp_hf_space_sync_churn_guard.md').read_text(encoding='utf-8')
          assert 'Status: completed' in Path('workpackage_claims/scrub_wp_hf_space_incident_closeout.md').read_text(encoding='utf-8')
          PY
          git config user.name 'solidprivacy-incident-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Close HF Space runtime incident'
          git push origin HEAD:scrub-hf-space-incident-closeout
