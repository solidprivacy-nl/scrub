name: Finalize premium core flow UI realignment

on:
  push:
    branches:
      - scrub-premium-core-flow-ui-realignment-plan
    paths:
      - .github/workflows/finalize_premium_core_flow_ui_realignment.yml
      - ops/finalize_premium_core_flow_ui_realignment.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize governance files atomically
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B scrub-premium-core-flow-ui-realignment-plan origin/scrub-premium-core-flow-ui-realignment-plan
          python ops/finalize_premium_core_flow_ui_realignment.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize premium core flow UI realignment plan"
          git push origin HEAD:scrub-premium-core-flow-ui-realignment-plan

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf

      - name: Run full regression
        run: |
          python -m pytest -q tests
