name: Finalize recognition profile configuration refactor

on:
  push:
    branches:
      - scrub-recognition-profile-configuration-refactor
    paths:
      - ops/finalize_recognition_profile_configuration_refactor.py
      - .github/workflows/finalize-recognition-profile-configuration-refactor.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrub-recognition-profile-configuration-refactor
          fetch-depth: 0
      - run: python ops/finalize_recognition_profile_configuration_refactor.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md WORKPACKAGES.md CHANGELOG.md RISK_REGISTER.md workpackage_claims/scrub_wp_recognition_profile_configuration_refactor.md ops/finalize_recognition_profile_configuration_refactor.py .github/workflows/finalize-recognition-profile-configuration-refactor.yml
          git commit -m "Finalize recognition profile configuration refactor"
          git push origin HEAD:scrub-recognition-profile-configuration-refactor
