''', encoding='utf-8')
          PY

      - name: Run required validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile presidio_streamlit.py
          python -m pytest -q tests/test_manual_correction_panel_density_implementation.py
          python -m pytest -q \
            tests/test_review_export_vertical_density_contracts.py \
            tests/test_review_surface_simplification_implementation.py \
            tests/test_basic_mode_declutter_implementation.py \
            tests/test_execution_interface_simplification_ui.py \
            tests/test_duplicate_input_surface_simplification_contracts.py
          mapfile -t MANUAL_TESTS < <(find tests -maxdepth 1 -type f | grep -E 'manual.*mask|mask.*manual' | sort)
          if ((${#MANUAL_TESTS[@]})); then
            python -m pytest -q "${MANUAL_TESTS[@]}"
          fi
          git diff --check

      - name: Finalize validation records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('CHANGELOG.md'),
              Path('WORKPACKAGES.md'),
              Path('handover/workpackages/20260716_2040_manual_correction_panel_density_implementation.md'),
              Path('workpackage_claims/scrub_wp_manual_correction_panel_density_simplification_implementation.md'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace('implemented; local validation pending', 'implemented; local validation passed')
              text = text.replace('Implemented; local validation pending.', 'Implemented; local validation passed.')
              text = text.replace('implemented / validation pending', 'completed / ready for app verification')
              text = text.replace('Validation pending in worker workflow.', 'Required worker validation passed.')
              text = text.replace('Worker validation pending.', 'Required worker validation passed.')
              text = text.replace('Local/worker validation pending.', 'Required worker validation passed.')
              text = text.replace('## Validation status\n\nPending.', '## Validation status\n\nRequired local/worker validation passed.')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __pycache__ tests/__pycache__
          git config user.name 'solidprivacy-workpackage-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            presidio_streamlit.py \
            tests/test_manual_correction_panel_density_implementation.py \
            CHANGELOG.md \
            WORKPACKAGES.md \
            RELEASE_NOTES.md \
            workpackage_claims/scrub_wp_manual_correction_panel_density_simplification_implementation.md \
            handover/workpackages/20260716_2040_manual_correction_panel_density_implementation.md
          git commit -m 'Simplify manual correction panel density'
          git push origin HEAD:scrub-manual-correction-panel-density-implementation
