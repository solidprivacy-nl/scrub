Next recommended step:
- `SCRUB-WP_MANUAL_CORRECTION_PANEL_DENSITY_SIMPLIFICATION_APP_VERIFY`.

'''
          workpackages = Path('WORKPACKAGES.md')
          workpackages.write_text(workpackages_entry + workpackages.read_text(encoding='utf-8'), encoding='utf-8')

          release_entry = '''## 2026-07-16 — Handmatige aanvulling compacter

- `Gemiste waarde toevoegen` gebruikt bij openen een compactere invoerregel voor waarde, type en vervanging.
- De dubbele interne kop is verwijderd; de functie en validatiemeldingen blijven ongewijzigd.
- De vervangtabel, exports, Scrub Key en terugzetworkflow zijn niet gewijzigd.

---

'''
          release_notes = Path('RELEASE_NOTES.md')
          release_notes.write_text(release_entry + release_notes.read_text(encoding='utf-8'), encoding='utf-8')

          claim_path = Path('workpackage_claims/scrub_wp_manual_correction_panel_density_simplification_implementation.md')
          claim = claim_path.read_text(encoding='utf-8').replace('Status: in_progress', 'Status: implemented / validation pending', 1)
          claim += f'''\n\nImplementation update:\n- Implemented at: {timestamp}\n- Product change limited to compact manual correction panel layout.\n- Validation pending in worker workflow.\n- Handover: `{handover_path}`\n'''
          claim_path.write_text(claim, encoding='utf-8')

          handover_path.parent.mkdir(parents=True, exist_ok=True)
          handover_path.write_text(f'''# Handover — SCRUB-WP_MANUAL_CORRECTION_PANEL_DENSITY_SIMPLIFICATION_IMPLEMENTATION

Repository worked in: solidprivacy-nl/scrub

