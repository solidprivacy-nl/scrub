name: Temporary control-document update

on:
  push:
    branches:
      - wp/processed-text-selection-cross-flow-regression
    paths:
      - tools/_temporary_apply_governance_admin.py
      - .github/workflows/_temporary-control-doc-update.yml

permissions:
  contents: write

jobs:
  update-control-documents:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: wp/processed-text-selection-cross-flow-regression
          fetch-depth: 0

      - name: Apply deterministic project administration
        run: python tools/_temporary_apply_governance_admin.py

      - name: Commit administration updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No control-document changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_PROMPT.md PROJECT_PROMPT_SHORT.md ROADMAP.md WORKPACKAGES.md CHANGELOG.md DECISION_LOG.md
          git commit -m "Record two-role governance and cross-flow candidate administration [skip ci]"
          git push origin HEAD:wp/processed-text-selection-cross-flow-regression
