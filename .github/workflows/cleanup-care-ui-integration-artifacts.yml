name: Cleanup Zorgfilter integration artifacts

on:
  push:
    branches:
      - scrub-care-profile-current-ui-integration
    paths:
      - .github/workflows/cleanup-care-ui-integration-artifacts.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: scrub-care-profile-current-ui-integration
          fetch-depth: 0

      - name: Remove generated bytecode and cleanup workflow
        run: |
          rm -rf __pycache__
          rm -f .github/workflows/cleanup-care-ui-integration-artifacts.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean"
            exit 1
          fi
          git commit -m "Remove generated Zorgfilter integration bytecode"
          git push origin HEAD:scrub-care-profile-current-ui-integration
