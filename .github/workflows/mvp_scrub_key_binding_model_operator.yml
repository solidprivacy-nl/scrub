name: MVP Scrub Key binding model operator

on:
  push:
    branches:
      - scrub-mvp-scrub-key-binding-model-implementation

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Record Scrub Key binding model validation'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out model branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-scrub-key-binding-model-implementation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run model validation
        run: |
          python -m py_compile scrub_key_binding.py
          python -m pytest -q \
            tests/test_scrub_key_binding_model.py \
            tests/test_mvp_scrub_key_binding_contracts.py \
            tests/test_mvp_scrub_key_binding_contract_validation.py \
            tests/test_scrub_key_secure_import_export.py \
            tests/test_mvp_scrub_key_roundtrip_validation.py \
            tests/test_mvp_scrub_key_roundtrip_report_contract.py

      - name: Record model validation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/validation
          cat > output/validation/mvp_scrub_key_binding_model_validation.json <<'JSON'
          {
            "workpackage": "SCRUB-WP_MVP_SCRUB_KEY_BINDING_MODEL_IMPLEMENTATION",
            "status": "targeted_validation_passed",
            "pure_model_module": "scrub_key_binding.py",
            "contract_fixture_digest": "516075e4970f0def6052aaac6885e12339e7cdbe012d4104aa7387c51a53faa3",
            "bound_statuses_implemented": 8,
            "fail_closed_statuses_implemented": 6,
            "legacy_v1_explicit_unbound": true,
            "streamlit_imported": false,
            "network_access": false,
            "file_writes": false,
            "export_integrated": false,
            "reinsert_integrated": false,
            "product_ui_changed": false,
            "production_ready": false,
            "human_review_required": true,
            "next_workpackage": "SCRUB-WP_MVP_SCRUB_KEY_BINDING_EXPORT_INTEGRATION"
          }
          JSON
          git config user.name 'solidprivacy-binding-model-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add output/validation/mvp_scrub_key_binding_model_validation.json
          git commit -m 'Record Scrub Key binding model validation'
          git push origin HEAD:scrub-mvp-scrub-key-binding-model-implementation
