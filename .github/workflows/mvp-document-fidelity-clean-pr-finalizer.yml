name: MVP document fidelity clean PR finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize-validate:
    if: github.event.pull_request.head.ref == 'scrub-mvp-document-hygiene-fidelity-hardening-clean'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out clean implementation branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-document-hygiene-fidelity-hardening-clean
          fetch-depth: 0

      - name: Finalize central records
        run: python scripts/finalize_clean_document_fidelity_branch.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest presidio-analyzer click==8.1.8 python-docx pymupdf reportlab pypdf streamlit pandas

      - name: Run clean-branch validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scrub_key_document_reinsert.py \
            mvp_phase6_document_cases.py \
            mvp_document_fidelity_report.py \
            reinsert_mode_ui.py
          python -m pytest -q \
            tests/test_mvp_document_hygiene_fidelity_hardening.py \
            tests/test_mvp_document_fidelity_report.py \
            tests/test_mvp_document_fidelity_ui_copy.py \
            tests/test_mvp_document_fidelity_pr_final_contracts.py \
            tests/test_scrub_key_document_reinsert.py \
            tests/test_mvp_phase6_e2e_synthetic_validation_matrix.py \
            tests/test_mvp_phase6_false_negative_gap_triage.py \
            tests/test_docx_hygiene_audit.py \
            tests/test_hf_space_sync_churn_guard.py | tee /tmp/pytest.log
          git diff --check
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          report_path = Path('output/validation/mvp_document_fidelity_pr_validation.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          report.update({
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'head_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'branch': 'scrub-mvp-document-hygiene-fidelity-hardening-clean',
              'clean_branch_rebuild': True,
              'main_synchronized': True,
              'compile_passed': True,
              'pytest_passed': True,
              'diff_check_passed': True,
              'overall_passed': True,
          })
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          Path('output/validation/mvp_document_fidelity_pr_validation.log').write_text(
              'clean_branch_rebuild=true\nmain_synchronized=true\n'
              + Path('/tmp/pytest.log').read_text(encoding='utf-8')
              + '\ncompile_status=0\npytest_status=0\ndiff_status=0\noverall_status=0\n',
              encoding='utf-8',
          )
          PY

      - name: Commit final clean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-validation-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize clean document fidelity hardening branch'
          git push origin HEAD:scrub-mvp-document-hygiene-fidelity-hardening-clean
