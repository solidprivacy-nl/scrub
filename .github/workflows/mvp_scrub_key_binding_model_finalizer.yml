name: MVP Scrub Key binding model finalizer

on:
  push:
    branches:
      - scrub-mvp-scrub-key-binding-model-implementation

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize Scrub Key binding model implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out model branch
        uses: actions/checkout@v4
        with:
          ref: scrub-mvp-scrub-key-binding-model-implementation
          fetch-depth: 0

      - name: Apply governance finalisation
        run: python scripts/finalize_mvp_scrub_key_binding_model_implementation.py

      - name: Remove one-time finalizer and generated cache
        shell: bash
        run: |
          rm -f scripts/finalize_mvp_scrub_key_binding_model_implementation.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit finalised model package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solidprivacy-binding-model-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Scrub Key binding model implementation'
          git push origin HEAD:scrub-mvp-scrub-key-binding-model-implementation
